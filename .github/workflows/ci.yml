# BamForm CI — BAMFORM-TST-001 §16
#
# Each stage gates the next. The offline suite is a release gate in its own
# right (PR-121): a green pipeline without it passing is not a releasable build.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write
  # CodeQL action calls the Actions API (get-a-workflow-run) for its status
  # report; without actions:read it fails "Resource not accessible by
  # integration" even when SARIF upload is disabled.
  actions: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  # A test run must never generate jobs or email real staff (PR-ENV-09)
  SCHEDULER_ENABLED: "false"
  NOTIFICATION_ENABLED: "false"
  APP_ENV: ci
  # puppeteer's postinstall downloads a ~150 MB Chromium during `npm ci`; that
  # download stalls indefinitely on the runner and hangs EVERY job's install
  # (slice 12). No CI job needs puppeteer's bundled browser — the PDF-render
  # tests (job 4) launch the runner's preinstalled Chrome via
  # PUPPETEER_EXECUTABLE_PATH (see job 4), and prod uses the Alpine system
  # chromium. So skip the download globally.
  PUPPETEER_SKIP_DOWNLOAD: "true"

jobs:

  # ---------------------------------------------------------------- 1
  static-analysis:
    name: 1 · Static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: ESLint (zero warnings tolerated)
        run: npm run lint -- --max-warnings=0
      - name: Prettier
        run: npm run format:check
      - name: TypeScript strict
        run: npm run typecheck
      - name: No VITE_ variable may hold a secret (PR-ENV-10)
        run: bash scripts/ci/assert-no-vite-secrets.sh
      - name: Every config key is documented in .env.example (PR-ENV-26)
        run: bash scripts/ci/assert-env-example-complete.sh

  # ---------------------------------------------------------------- 2
  secret-scan:
    name: 2 · Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }   # full history — first-run requirement
      - uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  # ---------------------------------------------------------------- 3
  unit:
    name: 3 · Unit
    needs: [static-analysis, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Unit tests
        # Coverage is NOT gated here: business logic is deliberately covered
        # by the INTEGRATION suite (real Postgres) rather than mocked unit
        # tests, so unit-only coverage is ~26%/28% by design. The combined
        # unit+integration coverage gate runs in job 4, where both suites
        # can execute against the same runner (coverage cannot be merged
        # across separate GitHub Actions jobs/runners).
        run: npm run test:unit
      - name: Signing determinism — golden hash (U-SIG-01)
        # The most important single test in the suite. If a dependency upgrade
        # changes canonical serialisation, /records/{id}/integrity would begin
        # reporting tampering on every historical record (PR-TST-04).
        run: npm run test:unit -- --testNamePattern="canonical serialisation"
      - name: Web unit tests (Vitest) with coverage
        # web has its own coverage gate, enforced inline by vitest.config.ts
        # (95% lines / 90% branches on offline/**, auth/**, lib/** — the
        # RK-01 outbox/sync surface; a failing threshold fails this step
        # directly, vitest exits non-zero). This is NOT part of job 4's nyc
        # merge gate: vitest's v8 coverage provider writes to web/coverage/,
        # never to the repo-root .nyc_output/ that job 4's api jest configs
        # write into and nyc merges — the two coverage gates are independent
        # by construction, so wiring this here cannot loosen job 4's 80%/70%
        # combined api gate.
        run: npm run test:unit:web

  # ---------------------------------------------------------------- 4
  integration:
    name: 4 · Integration (real dependencies)
    needs: unit
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bamform_test
          POSTGRES_USER: bamform
          POSTGRES_PASSWORD: ci_ephemeral_not_a_real_secret
        options: >-
          --health-cmd "pg_isready -U bamform"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
      minio:
        # bitnami/minio:latest 404s — Bitnami purged all free/rolling tags
        # from Docker Hub (Aug 2025); the repo now has zero tags. Pinned to
        # a frozen snapshot in the community "bitnamilegacy" mirror, same
        # image/env/behaviour otherwise. MinIO is not yet used by any test
        # in slices 1-4 (no S3/MinIO reference in api/src or api/test), so
        # this only unblocks job 4's service-container startup; it does
        # not affect any test or coverage gate. Not part of the coverage-
        # merge restructure — a separate, minimal, necessary infra fix so
        # job 4 can run at all.
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: bamform
          MINIO_ROOT_PASSWORD: ci_ephemeral_not_a_real_secret
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Locate a Chromium for the PDF-render tests (PUPPETEER_SKIP_DOWNLOAD is on)
        # ubuntu-latest ships google-chrome-stable preinstalled; puppeteer 21.x
        # drives it fine. Export the path so the integration step (and the
        # worker's ChromiumBrowserService, which reads PUPPETEER_EXECUTABLE_PATH
        # via ConfigService — same var prod sets to the Alpine chromium) uses it.
        run: |
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$CHROME" ]; then echo "no preinstalled Chrome found on the runner" >&2; exit 1; fi
          echo "PUPPETEER_EXECUTABLE_PATH=$CHROME" >> "$GITHUB_ENV"
          echo "Using Chromium at $CHROME"
      - name: Apply migrations
        run: npx prisma migrate deploy --schema=api/prisma/schema.prisma
        env: { DATABASE_URL: "postgresql://bamform:ci_ephemeral_not_a_real_secret@localhost:5432/bamform_test" }
      - name: Apply role grants (audit tables append-only)
        run: psql "$DATABASE_URL" -f api/prisma/grants.sql
        env: { DATABASE_URL: "postgresql://bamform:ci_ephemeral_not_a_real_secret@localhost:5432/bamform_test" }
      - name: Unit tests with coverage (feeds the combined gate below)
        run: npm run test:unit -- --coverage
      - name: Integration tests with coverage — asserts all 16 DBD §7 invariants
        run: npm run test:integration -- --coverage
        env:
          DATABASE_URL: postgresql://bamform:ci_ephemeral_not_a_real_secret@localhost:5432/bamform_test
          REDIS_URL: redis://localhost:6379
          MINIO_ENDPOINT: localhost:9000
      - name: Coverage gate — 80% lines / 70% branches (combined unit + integration)
        # Each suite's jest config writes a uniquely-named istanbul JSON into
        # the repo-root .nyc_output/ (unit-coverage.json / integration-
        # coverage.json); nyc reads and merges every file in that directory
        # automatically, so the check below is over the COMBINED coverage —
        # the only meaningful number, since business logic here is covered
        # by the integration suite, not by mocked unit tests.
        run: npx nyc check-coverage --lines 80 --branches 70
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: .nyc_output/ }

  # ---------------------------------------------------------------- 5
  contract:
    name: 5 · Contract (API vs OpenAPI)
    needs: integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Spectral lint the contract
        run: npx spectral lint api/openapi.yaml --fail-severity=warn
      - name: Breaking-change detection
        run: bash scripts/ci/oasdiff-check.sh
      - name: Implementation matches specification
        run: npm run test:contract
      - name: Every route authenticated unless allowlisted (C-07, threat E-6)
        run: npm run test:route-coverage
      - name: Every collection endpoint applies area scoping (C-08)
        run: npm run test:scope-coverage

  # ---------------------------------------------------------------- 6
  security:
    name: 6 · Security
    needs: contract
    runs-on: ubuntu-latest
    # S-06..S-09 (refresh-token reuse, step-up, lockout) and the S-18/S-22/
    # S-23/S-26/S-29 cases test:security wires in are genuine end-to-end
    # attack simulations against the running app (real Argon2id login, real
    # DB triggers, real role grants) — there is no unit-level equivalent for
    # them. This job had no service containers before this change, which is
    # the reason test:security was previously unrunnable here; provisioning
    # Postgres + Redis (mirrored from job 4's "integration" service block)
    # is the minimal fix so this job can actually execute those cases
    # instead of only re-asserting that job 4 already passed them.
    #
    # Slice 6 adds `minio` (mirrored from job 4's own MinIO service block,
    # same image/env) for the SAME reason: S-19 (attachment IDOR, 403),
    # S-30 (magic-byte rejects a renamed executable) and S-32 (oversized
    # attachment rejected) are genuine end-to-end attacks against the real
    # attachment upload/fetch endpoints with no unit-level equivalent.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bamform_test
          POSTGRES_USER: bamform
          POSTGRES_PASSWORD: ci_ephemeral_not_a_real_secret
        options: >-
          --health-cmd "pg_isready -U bamform"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["6379:6379"]
      minio:
        # See job 4's identical service block for why this pinned mirror
        # (bitnami/minio:latest 404s — Bitnami purged all tags Aug 2025).
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        env:
          MINIO_ROOT_USER: bamform
          MINIO_ROOT_PASSWORD: ci_ephemeral_not_a_real_secret
        ports: ["9000:9000"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: Dependency audit
        # Fails on any HIGH/CRITICAL advisory except a small, documented
        # allowlist (see the script). NOT --audit-level weakening: a NEW
        # advisory of any id still fails the build.
        run: bash scripts/ci/audit-high.sh
      - uses: github/codeql-action/init@v3
        with: { languages: javascript-typescript }
      # Private repos need GitHub Advanced Security for the code-scanning
      # dashboard upload; without it the upload fails ("Resource not
      # accessible by integration"). We run the analysis and GATE LOCALLY on
      # the SARIF instead — same security value, no GHAS dependency. Enable
      # GHAS later if the dashboard is wanted, then set upload back to true.
      - uses: github/codeql-action/analyze@v3
        with:
          upload: false
          upload-database: false
          output: codeql-results
      - name: CodeQL — fail on any HIGH/CRITICAL finding (security-severity >= 7.0)
        run: |
          count=$(jq '[.runs[] as $r | ($r.tool.driver.rules // []) as $rules
            | $r.results[]? | .ruleId as $rid
            | ($rules[] | select(.id==$rid) | (.properties["security-severity"]? // "0") | tonumber)
            | select(. >= 7.0)] | length' codeql-results/javascript.sarif)
          echo "CodeQL HIGH/CRITICAL findings: $count"
          [ "$count" -eq 0 ]
      - name: Build image for scanning
        run: docker build -f api/Dockerfile -t bamform-api:scan .
      - name: Trivy — fail on HIGH/CRITICAL
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bamform-api:scan
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Apply migrations (test:security runs S-06..S-09/S-18/S-22/S-23/S-26/S-29 against real Postgres)
        run: npx prisma migrate deploy --schema=api/prisma/schema.prisma
        env: { DATABASE_URL: "postgresql://bamform:ci_ephemeral_not_a_real_secret@localhost:5432/bamform_test" }
      - name: Apply role grants (S-26 needs the real bamform_app permission-denied behaviour)
        run: psql "$DATABASE_URL" -f api/prisma/grants.sql
        env: { DATABASE_URL: "postgresql://bamform:ci_ephemeral_not_a_real_secret@localhost:5432/bamform_test" }
      - name: Security test cases S-01 to S-34
        run: npm run test:security
        env:
          DATABASE_URL: postgresql://bamform:ci_ephemeral_not_a_real_secret@localhost:5432/bamform_test
          REDIS_URL: redis://localhost:6379
          MINIO_ENDPOINT: localhost:9000
      - name: CSP contains no unsafe-inline or unsafe-eval (S-28)
        run: bash scripts/ci/assert-csp-safe.sh
      - name: Passwords never appear in log output (S-15)
        run: npm run test:log-redaction

  # ---------------------------------------------------------------- 7
  offline:
    name: 7 · Offline suite · RELEASE GATE
    needs: security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Serve the production build (bamform-web only)
        # web/playwright.config.ts's offline/a11y/e2e projects intercept
        # every /api/v1/** call at the browser network boundary
        # (e2e/support/fake-server.ts) — the origin under test never
        # actually reaches bamform-api. Composing bamform-api/postgres/
        # redis/minio too would add real failure surface (e.g. the api
        # track's MinIO image) for zero test value, so only the static
        # nginx-served build is brought up here.
        run: docker compose -f docker-compose.ci.yml up -d --wait bamform-web
      - name: Offline suite O-01 to O-16
        # RK-01 — losing a technician's completed record is the highest-impact
        # risk in the project. No known-issue waivers permitted here. O-06/
        # O-07/O-12 are test.fixme (attachments UI / SW-update lifecycle not
        # built this pass — web/e2e/offline/pending.spec.ts) and report as
        # skipped, not passed or failed.
        run: npm run test:offline
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: offline-traces, path: test-results/ }

  # ---------------------------------------------------------------- 8
  e2e:
    name: 8 · E2E · ${{ matrix.viewport }}
    needs: offline
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        viewport: ["375", "768", "1280"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f docker-compose.ci.yml up -d --wait bamform-web
      - name: Journeys E-01 to E-14 at ${{ matrix.viewport }}px
        # HONEST STATUS: E-01..E-14 (URD 5.x journeys, docs/TEST_PLAN.md §10)
        # are slice 11/12/13 work — verifier queue, PDF render, admin UI —
        # none of which exist on main yet; web/e2e/journeys has zero spec
        # files today. This step is PENDING until the first journey spec
        # lands, then runs the real suite at all three viewports with no
        # further CI change (the VIEWPORT_WIDTH -> playwright.config.ts `e2e`
        # project plumbing is already wired).
        #
        # This is NOT `--pass-with-no-tests`: the gate keys on spec PRESENCE.
        # A blanket red here (via "No tests found") permanently reds main AND,
        # through job 10/11's `needs: e2e`, silently SKIPS the Build + Migration
        # -check safety gates for every slice — including slices that add
        # migrations. The pending state is printed loudly (::warning) and this
        # becomes a HARD GATE automatically the moment a journey spec exists.
        run: |
          if [ -z "$(find web/e2e/journeys -name '*.spec.ts' 2>/dev/null)" ]; then
            echo "::warning title=E2E journeys pending::E-01..E-14 (web/e2e/journeys) not yet implemented — slices 11-13. No acceptance gate active at ${{ matrix.viewport }}px."
            echo "PENDING: no E2E journey specs exist yet — skipping real run. This job becomes a hard gate automatically once a spec lands in web/e2e/journeys."
            exit 0
          fi
          npm run test:e2e
        env: { VIEWPORT_WIDTH: "${{ matrix.viewport }}" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ matrix.viewport }}px
          path: playwright-report/

  # ---------------------------------------------------------------- 9
  accessibility:
    name: 9 · Accessibility
    needs: offline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: docker compose -f docker-compose.ci.yml up -d --wait bamform-web
      - name: axe-core — WCAG 2.1 AA, zero violations
        # Covers the three screens that exist (SignIn/JobList/RecordCapture)
        # at 375px — the only viewport this foundation pass tested (see job
        # 8's honest-pending note re: the wider matrix). 6/6 per
        # web/e2e/a11y/pages.spec.ts.
        run: npm run test:a11y

  # --------------------------------------------------------------- 10
  build:
    name: 10 · Build images
    needs: [e2e, accessibility]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build, tagged with commit SHA
        run: |
          docker build -f api/Dockerfile -t "bamform-api:${GITHUB_SHA::7}" .
          docker build -f web/Dockerfile -t "bamform-web:${GITHUB_SHA::7}" \
            --build-arg "VITE_APP_VERSION=${GITHUB_SHA::7}" .

  # --------------------------------------------------------------- 11
  migration-check:
    name: 11 · Migration check
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bamform_mig
          POSTGRES_USER: bamform
          POSTGRES_PASSWORD: ci_ephemeral_not_a_real_secret
        options: >-
          --health-cmd "pg_isready -U bamform"
          --health-interval 10s --health-timeout 5s --health-retries 5
        ports: ["5432:5432"]
    env:
      DATABASE_URL: postgresql://bamform:ci_ephemeral_not_a_real_secret@localhost:5432/bamform_mig
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm }
      - run: npm ci
      - name: (a) apply to a FRESH database
        run: npx prisma migrate deploy --schema=api/prisma/schema.prisma
      - name: (b) apply to a copy of the PREVIOUS release's schema
        run: bash scripts/ci/migrate-from-previous.sh
      - name: (c) re-run — migrations must be idempotent
        run: npx prisma migrate deploy --schema=api/prisma/schema.prisma
      - name: Every migration documents its reversal (M-04)
        run: bash scripts/ci/assert-migration-reversal-documented.sh
      - name: Large-table indexes use CONCURRENTLY (M-06)
        run: bash scripts/ci/assert-concurrent-indexes.sh

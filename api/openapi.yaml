openapi: 3.1.0

info:
  title: BamForm API
  version: 1.0.0
  summary: Preventive maintenance record and approval system
  description: |
    Machine-readable contract for BamForm. This document is authoritative;
    BAMFORM-API-001 explains it. Divergence between this specification and the
    running implementation fails the CI build.

    Conventions, error catalogue, permission matrix and the offline sync
    protocol are described in BAMFORM-API-001.
  contact:
    name: BamForm project
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary

servers:
  - url: https://form.bevorasg.com/api/v1
    description: Production
  - url: http://localhost:3000/api/v1
    description: Local development

tags:
  - name: Health
  - name: Auth
  - name: Areas
  - name: Asset Types
  - name: Assets
  - name: Scheduling
  - name: Templates
  - name: Jobs
  - name: Approval
  - name: Delegations
  - name: Sync
  - name: Archive
  - name: Reports
  - name: Audit
  - name: Admin

security:
  - bearerAuth: []

paths:

  /health:
    get:
      tags: [Health]
      operationId: getHealth
      summary: Liveness probe
      description: No dependency round-trip - confirms only that the process is up.
      security: []
      responses:
        '200':
          description: Service is live
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: { type: string, const: ok }
                  version: { type: string }
                  commit: { type: string }
              example: { status: ok, version: 1.0.0, commit: a1b2c3d }

  /health/ready:
    get:
      tags: [Health]
      operationId: getReadiness
      summary: Readiness probe - checks Postgres, Redis and MinIO
      description: Distinct from `/healthz` (liveness) - fails if any dependency is unreachable.
      security: []
      responses:
        '200':
          description: All dependencies reachable
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, const: ready }
                  checks:
                    type: object
                    additionalProperties: { type: string }
              example: { status: ready, checks: { postgres: ok, redis: ok, minio: ok } }
        '503':
          $ref: '#/components/responses/Problem'

  /healthz:
    get:
      tags: [Health]
      operationId: getHealthz
      summary: Liveness probe (slice 1 implementation)
      description: |
        The actual liveness probe implemented so far — no dependency
        round-trip (health.controller.ts). Distinct from `/health` above,
        which documents the eventual richer liveness response (version +
        commit) that slice 8's `dist/healthcheck.js` build-out is expected
        to serve; `/health/ready` (Postgres/Redis/MinIO checks) is likewise
        not yet implemented. Tracked in
        `api/test/contract/known-gaps.ts#FUTURE_OPENAPI_PATHS`.
      security: []
      responses:
        '200':
          description: Service is live
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }
              example: { status: ok }

  /.well-known/jwks.json:
    get:
      tags: [Auth]
      operationId: getJwks
      summary: Published Ed25519 verification keys
      description: PR-087 - clients use `kid` to select the correct verification key.
      security: []
      responses:
        '200':
          description: JSON Web Key Set
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { type: object, additionalProperties: true }
              example: { keys: [ { kty: OKP, crv: Ed25519, kid: bf-2026-07, x: "11qYAY…" } ] }

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Authenticate and receive an access token
      description: |
        Rate-limited (10/min per IP); account lockout after 5 failures.

        Returns `AuthResult` — access token in the body, refresh token in the
        `bf_refresh` cookie — in every case EXCEPT one: when `MFA_ENABLED` is
        true AND the account holds a role in `MFA_REQUIRED_ROLES`
        (`ADMIN`, `TEAM_LEADER`, `ENGINEER`, `DOC_CONTROLLER`, `AUDITOR` by
        default; `MAINTAINER` is exempt - SEC RS-3/SO-3). In that case the
        password was accepted but the login is not finished: the response is
        an `MfaChallenge` with NO access token and NO refresh cookie, and the
        client must call `/auth/mfa/verify` (or `/auth/mfa/recovery`, or
        `/auth/mfa/enrol` + `/auth/mfa/enrol/confirm` when `mfaEnrolled` is
        false) to complete it.

        `MFA_ENABLED` defaults to **false**, in which case this endpoint
        behaves exactly as it did before slice 13-MFA.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password, minLength: 12 }
            example: { email: tech@bevorasg.com, password: "••••••••••••" }
      responses:
        '200':
          description: |
            Authenticated (refresh token set as an HttpOnly cookie), or an MFA
            challenge issued (no cookie set - see the endpoint description).
          headers:
            Set-Cookie:
              description: bf_refresh - HttpOnly, Secure, SameSite=Strict. Absent on an MfaChallenge response.
              schema: { type: string }
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/AuthResult'
                  - $ref: '#/components/schemas/MfaChallenge'
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/password:
    post:
      tags: [Auth]
      operationId: changeOwnPassword
      summary: Change your own password
      description: |
        Own account only - the subject comes from the access token, never the
        body. Argon2id, minimum 12 characters, same policy as `/auth/login`
        and `POST /users`. On success `password_changed_at` is stamped,
        `must_change_password` is cleared, and every OTHER refresh-token
        family for the user is revoked (the caller's own session survives).
        Audited as `password_changed`. Rate-limited 10/min per user.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204': { description: Password changed }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/mfa/enrol:
    post:
      tags: [Auth]
      operationId: enrolMfa
      summary: Begin TOTP enrolment - issue a shared secret
      description: |
        Generates a 160-bit TOTP secret, stores it field-encrypted, and
        returns it in base32 plus `otpauth://` URI form. `mfa_enrolled` stays
        false until `/auth/mfa/enrol/confirm` succeeds; calling this endpoint
        again before confirmation REPLACES the pending secret.

        Authorised by EITHER a normal `Authorization: Bearer` access token (a
        signed-in user enrolling voluntarily) OR the `challengeToken` from a
        `/auth/login` MFA challenge (a user who must enrol before they can
        finish logging in). It is never anonymous.

        Returns 409 if the account is already enrolled - the only way out of
        an enrolled state is `POST /users/{userId}/mfa-reset`.

        The QR image is rendered client-side; the API has no QR dependency.

        Rate-limited 10/min per user, and refused with 429 while the account
        is locked out - the same treatment as its three siblings.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrolRequest' }
      responses:
        '200':
          description: Pending secret issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrolResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '409':
          description: Already enrolled
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/mfa/enrol/confirm:
    post:
      tags: [Auth]
      operationId: confirmMfaEnrolment
      summary: Confirm TOTP enrolment and receive the recovery codes
      description: |
        Verifies a code against the pending secret, sets `mfa_enrolled`, and
        returns the ten single-use recovery codes. **They are returned exactly
        once and are never retrievable again.**

        If this call was authorised by a `challengeToken` (i.e. it happened
        during a login challenge) it also completes the login: `auth` carries
        the `AuthResult` and the refresh cookie is set. For a voluntary
        enrolment by an already-signed-in user, `auth` is null.

        Failures count toward the same account-lockout counter a wrong
        password does. Rate-limited 10/min per user.

        NEVER ANONYMOUS. The empty `{}` security requirement below does not
        mean "no credential" - it means the credential is the `challengeToken`
        body field, which OpenAPI 3.1 cannot express as a security scheme. An
        unauthenticated caller gets 401.
      security:
        - bearerAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaEnrolConfirmRequest' }
      responses:
        '200':
          description: Enrolled. Recovery codes returned once.
          headers:
            Set-Cookie:
              description: bf_refresh - set only when this call completed a login challenge.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MfaEnrolConfirmResponse' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/mfa/verify:
    post:
      tags: [Auth]
      operationId: verifyMfa
      summary: Complete login with a TOTP code
      description: |
        Second step of login. Consumes the `challengeToken` from
        `/auth/login`; on success issues the access token and refresh cookie
        exactly as a password-only login would.

        RFC 6238: 6 digits, 30 s period, plus/minus one step of clock skew.
        An accepted code's time step is recorded, so the same code cannot be
        replayed inside its own 30-second window. A wrong code returns the
        same opaque 401 as a wrong/expired challenge token, and counts toward
        the account-lockout counter. Rate-limited 10/min per user.

        The challenge token is SINGLE-USE: the first request to redeem it wins
        and every other one - including a simultaneous one - gets 401.

        NEVER ANONYMOUS. The empty `{}` security requirement below does not
        mean "no credential" - it means the credential is the `challengeToken`
        body field, which OpenAPI 3.1 cannot express as a security scheme. An
        unauthenticated caller gets 401.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaVerifyRequest' }
      responses:
        '200':
          description: Authenticated. Refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: bf_refresh - HttpOnly, Secure, SameSite=Strict
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/mfa/recovery:
    post:
      tags: [Auth]
      operationId: redeemMfaRecoveryCode
      summary: Complete login with a single-use recovery code
      description: |
        Redeems one of the ten codes issued at enrolment. The code is marked
        used and can never be redeemed again (it is never deleted - INV-07).
        Audited as `mfa_recovery_code_used`. Failures count toward the
        account-lockout counter. Rate-limited 5/min per user. The
        `challengeToken` is single-use, as on `/auth/mfa/verify`.

        NEVER ANONYMOUS. The empty `{}` security requirement below does not
        mean "no credential" - it means the credential is the `challengeToken`
        body field, which OpenAPI 3.1 cannot express as a security scheme. An
        unauthenticated caller gets 401.
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MfaRecoveryRequest' }
      responses:
        '200':
          description: Authenticated. Refresh token is set as an HttpOnly cookie.
          headers:
            Set-Cookie:
              description: bf_refresh - HttpOnly, Secure, SameSite=Strict
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshToken
      summary: Rotate the refresh token and issue a new access token
      description: |
        Single-use with rotation. Presenting a spent token revokes the entire
        token family and raises a security audit event.
      security: []
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Revoke the refresh family and deny-list the current access token
      description: Adds the current access token's `jti` to the Redis denylist for the remainder of its natural lifetime (PR-088).
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Problem' }

  /auth/step-up:
    post:
      tags: [Auth]
      operationId: stepUp
      summary: Re-authenticate immediately before signing
      description: PR-API-07 - refreshes `last_authenticated_at` so a subsequent signing action (approve/verify) passes its step-up check.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password }
      responses:
        '200':
          description: Step-up window refreshed
          content:
            application/json:
              schema:
                type: object
                properties:
                  stepUpValidUntil: { type: string, format: date-time }
              example: { stepUpValidUntil: '2026-07-24T02:30:00Z' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /auth/me:
    get:
      tags: [Auth]
      operationId: getCurrentUser
      summary: Current user, roles, area scope and active delegations
      description: Re-reads area scope and delegations fresh from the database - the access token carries neither claim.
      responses:
        '200':
          description: Current principal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CurrentUser' }
        '401': { $ref: '#/components/responses/Problem' }

  /areas:
    get:
      tags: [Areas]
      operationId: listAreas
      summary: List areas
      description: DBD §6.1 - the scope source for PR-API-10; areas are not themselves area-scoped.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated areas
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Area' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Areas]
      operationId: createArea
      summary: Create an area
      description: ADMIN only - organisational/master data.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Area' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Duplicate area code
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /areas/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Areas]
      operationId: getArea
      summary: Get an area
      description: Not itself area-scoped (an area cannot be scoped to itself).
      responses:
        '200':
          description: Area
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Area' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Areas]
      operationId: updateArea
      summary: Update an area. Deactivation only, never deletion.
      description: ADMIN only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AreaUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Area' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /asset-types:
    get:
      tags: [Asset Types]
      operationId: listAssetTypes
      summary: List asset types
      description: Global reference data - not area-scoped.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated asset types
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AssetType' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Asset Types]
      operationId: createAssetType
      summary: Create an asset type
      description: ENGINEER or ADMIN. Exactly one form_template per asset type (1:1).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetTypeCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetType' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Duplicate asset-type code, or the form_template already governs another asset type
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /asset-types/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Asset Types]
      operationId: getAssetType
      summary: Get an asset type
      description: DBD §6.7 - one form_template per asset type (1:1).
      responses:
        '200':
          description: Asset type
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetType' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Asset Types]
      operationId: updateAssetType
      summary: Update an asset type. Deactivation only, never deletion.
      description: ENGINEER or ADMIN.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetTypeUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetType' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /assets:
    get:
      tags: [Assets]
      operationId: listAssets
      summary: List assets
      description: Filtered to the caller's area scope (PR-API-10) when they have one.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: assetTypeId
          in: query
          schema: { type: string, format: uuid }
        - name: areaId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/AssetStatus' }
      responses:
        '200':
          description: Paginated assets
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Asset' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Assets]
      operationId: createAsset
      summary: Create an asset
      description: ENGINEER or ADMIN. Rejects a duplicate `code` (INV-06).
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '409':
          description: Duplicate asset code
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /assets/{assetId}:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [Assets]
      operationId: getAsset
      summary: Get an asset
      description: 403 (`/errors/out-of-scope`), not a silent 404, when the asset exists but is outside the caller's area scope.
      responses:
        '200':
          description: Asset
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Assets]
      operationId: updateAsset
      summary: Update an asset. Deactivation only, never deletion.
      description: |
        ENGINEER or ADMIN. `status`/`active` are the only removal mechanism
        (deactivation).

        `code` is PRINTED on every record raised against this machine — as the
        machine code in the PDF header and footer, and in the `assetCode` column
        of a bulk export's manifest — and a record's PDF is re-rendered live
        from current data on every request, so nothing is frozen at archive.
        Changing `code` is therefore REFUSED with
        `/errors/archived-record-dependency` (409) when the machine has any
        ARCHIVED record.

        `code` is the ONLY field this applies to. `description`, `manufacturer`,
        `model`, `areaId`, `locationDetail`, `status` and `active` do not appear
        on the rendered record and are never refused, so describing, re-siting
        or retiring a machine always works. A machine with no archived records
        is freely editable, and re-sending the same `code` is never refused.

        Note: once a machine has an archived record, an auto-generated
        `codeProvisional` code can no longer be confirmed, because confirming it
        requires a `code` change.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Asset' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /assets/{assetId}/history:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [Assets]
      operationId: getAssetHistory
      summary: Complete maintenance history for one asset
      description: UR-007. Real and area-scoping-correct today; returns an empty page until scheduling/result-capture (slice 5/6) generates jobs.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated record history
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RecordSummary' }
        '404': { $ref: '#/components/responses/Problem' }

  /assets/{assetId}/schedule:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [Assets]
      operationId: getAssetSchedule
      summary: Current schedule_rule state for one asset (one entry per frequency)
      description: |
        UR-023. 403 (`/errors/out-of-scope`), not a silent 404, when the asset
        exists but is outside the caller's area scope. A row exists for every
        frequency with at least one active template item in the asset's
        template's current revision (PR-053) — created lazily on first read
        if the asset was onboarded after its template revision went current.
      responses:
        '200':
          description: Schedule rules, one per scheduled frequency
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ScheduleRule' }
        '404': { $ref: '#/components/responses/Problem' }
    put:
      tags: [Assets]
      operationId: adjustAssetSchedule
      summary: Manually adjust one frequency's next due date
      description: |
        TEAM_LEADER, ENGINEER or ADMIN (permission matrix §4.1 "Adjust
        schedules"). PR-058/UR-025: `adjustedReason` is mandatory (minimum 10
        characters) and is recorded to the audit trail.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ScheduleAdjust' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ScheduleRule' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /assets/{assetId}/documents:
    parameters:
      - $ref: '#/components/parameters/AssetId'
    get:
      tags: [Assets]
      operationId: getAssetDocuments
      summary: The preventive-maintenance documents this machine carries
      description: |
        Slice 27-ASSETDOC. The owner's process step 4 — "he will go to his
        assigned machine and select the form to start" — reads this. Open to
        every authenticated user who can see the machine (role-gating it would
        remove read access from MAINTAINER, the role that most needs it);
        403 (`/errors/out-of-scope`), not a silent 404, when the machine exists
        but is outside the caller's area scope.

        DEACTIVATED documents are included: a machine's history has to stay
        visible. It is the scheduler that stops raising work for them.
      responses:
        '200':
          description: The machine's tagged documents
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AssetDocument' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Assets]
      operationId: tagAssetDocument
      summary: Tag a preventive-maintenance document to this machine
      description: |
        ADMIN only — the owner's process step 2 ("Admin will log in to setup
        the machine tagged with which preventive Maintenance document").

        409 if this machine already carries that document; a machine may carry
        any number of DIFFERENT documents, and any number of machines may carry
        the same one.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetDocumentCreate' }
      responses:
        '201':
          description: Tagged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDocument' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /asset-documents/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Assets]
      operationId: updateAssetDocument
      summary: Change a tagged document's form number, or deactivate it
      description: |
        ENGINEER or ADMIN. There is deliberately NO DELETE: INV-16 forbids
        DELETE on record tables, and a document that has already generated jobs
        must stay resolvable. `active: false` stops future job generation and
        leaves the history intact.

        `machineNumber` is substituted into the template title at RENDER, and a
        record's PDF is re-rendered live from current data on every request —
        nothing is frozen at archive. A change is therefore REFUSED with
        `/errors/archived-record-dependency` (409) when any ARCHIVED job
        on this document would print a different title as a result. The
        document is not frozen by the existence of archived records: the change
        is allowed when the title carries no fillable run, when the archived
        records carry their own captured number, and when no archived record
        exists. Toggling `active` is never refused — it changes nothing any
        record prints.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssetDocumentUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AssetDocument' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /schedule:
    get:
      tags: [Scheduling]
      operationId: listPlannerSchedule
      summary: Every machine's schedule across a date window — the planner grid
      description: |
        Slice 31-PLANNER. The CROSS-MACHINE sibling of
        `GET /assets/{assetId}/schedule`, which can only answer "when is THIS
        machine due". This answers "what is due in week 12", across every
        machine in the caller's area scope — the question `ML-S-MFT-00015`
        (76 machines down the side, 52 work weeks across) exists to answer,
        and the one that had to be answerable here before that spreadsheet
        could be retired.

        Carries NO role gate, exactly like `GET /assets/{assetId}/schedule`:
        every authenticated user may read a schedule, and gating an aggregate
        of rows the caller may already read one machine at a time would only
        remove access from MAINTAINER, DOC_CONTROLLER and AUDITOR. Area
        scoping (PR-API-10) is enforced in the repository and is the real
        boundary — an out-of-scope machine is ABSENT from the page (a
        collection read), not a 403 (which is what the single-asset read
        returns).

        Adjusting a date is NOT done here: `PUT /assets/{assetId}/schedule`
        remains the only write, still PLANNER/TEAM_LEADER/ENGINEER/ADMIN.

        `from`/`to` are inclusive and both default to the current calendar
        year (work week 1 starts 1 January). A malformed, inverted or
        excessively long window is refused with 422 rather than silently
        defaulted.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: from
          in: query
          description: Inclusive window start. Defaults to 1 January of the current year.
          schema: { type: string, format: date }
        - name: to
          in: query
          description: Inclusive window end. Defaults to 31 December of the current year.
          schema: { type: string, format: date }
        - name: areaId
          in: query
          description: Intersected with (never widening) the caller's own area scope.
          schema: { type: string, format: uuid }
        - name: assetTypeId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Paginated schedule rules with their projected visits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PlannerScheduleRow' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /schedule/{scheduleRuleId}/assignable-users:
    parameters:
      - $ref: '#/components/parameters/ScheduleRuleId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
    get:
      tags: [Scheduling]
      operationId: listAssignableUsers
      summary: Who this machine's PM may be given to
      description: |
        Slice 32-PLANNERJOB. PLANNER/TEAM_LEADER/ENGINEER/ADMIN — the SAME
        role set as `PUT /schedule/{scheduleRuleId}/default-assignee` and
        `POST /jobs/{jobId}/assign`: the right to see the candidates and the
        right to choose one are the same right.

        ONE PICKER FOR BOTH ASSIGNMENT LEVELS. The standing assignee on the
        rule and the assignee on a job generated from it are judged against
        the SAME machine's area, so the candidate sets are identical by
        construction; two endpoints would be two lists that could disagree.
        Keyed by the RULE rather than a job because the rule exists first — a
        visit whose job has not been generated yet still needs a picker.

        Returns exactly the users `POST /jobs/{jobId}/assign` would ACCEPT:
        active, holding a result-recording role
        (MAINTAINER/TEAM_LEADER/ENGINEER, §4.1), and area-scoped to reach the
        machine (a machine with no area is assignable only to users with no
        area restriction). Computed by the same service that enforces the
        check, so a picker built on it cannot offer someone the server will
        refuse.

        It exists because `GET /users` is ADMIN-only, leaving three of the
        four roles that may assign with no readable source for the list.
        Deliberately NARROWER than `User`: a name and the roles that put the
        person on the list, never email or employee id.

        404 for an unknown rule; 403 `/errors/out-of-scope` when the rule's
        machine is outside the caller's area scope — so this cannot enumerate
        technicians against a machine the caller cannot see.
      responses:
        '200':
          description: The users this machine's maintenance may be assigned to
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/AssignableUser' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /schedule/{scheduleRuleId}/default-assignee:
    parameters:
      - $ref: '#/components/parameters/ScheduleRuleId'
    put:
      tags: [Scheduling]
      operationId: setScheduleDefaultAssignee
      summary: Set who normally does this machine's PM
      description: |
        Slice 32-PLANNERJOB. PLANNER/TEAM_LEADER/ENGINEER/ADMIN — the same set
        as `PUT /assets/{assetId}/schedule`: deciding when controlled work
        happens and deciding who does it are the same planning job.

        Writes `schedule_rule.default_assignee_id` and NOTHING ELSE.
        `JobGenerationService` reads it when it CREATES a job, so this affects
        work not yet generated: a job already raised keeps whoever it has, and
        reassigning a generated job (`POST /jobs/{jobId}/assign`) never writes
        back here. The two levels are independent by construction.

        `defaultAssigneeId: null` clears the standing assignee, returning the
        rule to generating unassigned jobs.

        Validated with the same rule as `POST /jobs/{jobId}/assign`, against
        this machine's area — and validated AGAIN at generation time, because
        eligibility lapses in between (someone leaves, a role is revoked, an
        area scope is narrowed). An ineligible default at generation time
        produces an UNASSIGNED job plus an audit record naming the id that
        failed; it never refuses to generate, because the job is the
        controlled record.

        No reason field, unlike `PUT /assets/{assetId}/schedule`: rostering
        changes every time someone takes leave, and a mandatory reason there
        would be typed through rather than thought about. The change is still
        audited with before/after ids.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetDefaultAssigneeRequest' }
      responses:
        '200':
          description: The rule's standing assignee after the change
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SetDefaultAssigneeResult' }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: "`/errors/out-of-scope` - the rule's machine is outside the caller's area scope"
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422':
          description: '`/errors/validation-failed` - the assignee is unknown, inactive, holds no result-recording role, or cannot reach the machine''s area'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /approval-routes:
    get:
      tags: [Asset Types]
      operationId: listApprovalRoutes
      summary: List approval routes
      description: |
        Slice 13-TL. Read-only, seeded reference data (PR-DBD-09) - resolves
        the approvalRouteId that POST /asset-types requires. Routes are
        never created via the API.
      responses:
        '200':
          description: Active approval routes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ApprovalRoute' }
        '401': { $ref: '#/components/responses/Problem' }

  /templates:
    get:
      tags: [Templates]
      operationId: listTemplates
      summary: List form templates
      description: |
        Read-only - the twelve source templates are loaded by BAMFORM-TLP-001's
        separate tooling (PR-DBD-10), not through this API.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated templates
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/FormTemplate' }
        '401': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Templates]
      operationId: createTemplate
      summary: Create a form template shell (BAMFORM-TLP-001 template load)
      description: |
        ENGINEER or DOC_CONTROLLER. Slice 13-TL - exists solely for the
        TLP-001 load tooling (PR-TLP-07: the load is an authenticated,
        audited operation through the real API, never a DB migration).
        Content (items, measurements, standing content) still arrives only
        through the revision-authoring endpoints below.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTemplateRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormTemplate' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Document number already exists (INV-07)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /templates/{templateId}:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Templates]
      operationId: getTemplate
      summary: Get a form template. Includes the current revision summary.
      description: Read-only - see `listTemplates`.
      responses:
        '200':
          description: Form template
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormTemplate' }
        '404': { $ref: '#/components/responses/Problem' }

  /templates/{templateId}/revisions:
    parameters:
      - name: templateId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Templates]
      operationId: listRevisions
      summary: Full revision history for a template
      description: UR-011. Newest first (by `sequenceOrdinal` descending).
      responses:
        '200':
          description: Revisions, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TemplateRevision' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Templates]
      operationId: createRevision
      summary: Create a draft revision. Sequence is assigned server-side.
      description: ENGINEER or DOC_CONTROLLER. Copies forward the current revision's items/measurements/standing content (PR-028).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [revisionCode, changeDescription]
              properties:
                revisionCode: { type: string, examples: [F] }
                changeDescription: { type: string, minLength: 5 }
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateRevision' }
        '422':
          description: Would create a gap in the revision sequence
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /revisions/{revisionId}:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    get:
      tags: [Templates]
      operationId: getRevision
      summary: Get a template revision
      description: Includes the full items/measurements/standing content for this specific revision (frozen once approved).
      responses:
        '200':
          description: Revision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateRevision' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Templates]
      operationId: patchRevision
      summary: Edit draft metadata (revision code, change description, standing content)
      description: Only while the revision is DRAFT (ENGINEER or DOC_CONTROLLER).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                revisionCode: { type: string }
                changeDescription: { type: string, minLength: 5 }
                standingContent: { $ref: '#/components/schemas/StandingContent' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateRevision' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Revision is not DRAFT
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /revisions/{revisionId}/items:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    put:
      tags: [Templates]
      operationId: replaceRevisionItems
      summary: Replace the checklist items on a draft revision
      description: |
        Documented as "replace wholesale" - implemented as an upsert by
        `stableKey` (existing rows updated in place, a dropped stableKey is
        soft-removed via `active=false`, not deleted: `bamform_app` holds no
        DELETE grant on any table, INV-16). The response never includes
        `active` - it is server-internal and always true for any row
        returned (every read path filters `active=true`).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/TemplateItemInput' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TemplateItem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Revision not in draft
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /revisions/{revisionId}/measurements:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    put:
      tags: [Templates]
      operationId: replaceRevisionMeasurements
      summary: Replace the measurement definitions on a draft revision
      description: |
        Documented as "replace wholesale" - implemented as an upsert by
        `stableKey` (same mechanism as `PUT .../items`, see that operation's
        description) for the same INV-16 (no DELETE grant) reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/TemplateMeasurement' }
      responses:
        '200':
          description: Replaced
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TemplateMeasurement' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Revision not in draft
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Specification limits inverted (lowerLimit > upperLimit, INV-04)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /revisions/{revisionId}/submit:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    post:
      tags: [Templates]
      operationId: submitRevision
      summary: Submit a draft revision for approval. DRAFT -> PENDING_APPROVAL.
      description: ENGINEER or DOC_CONTROLLER.
      responses:
        '200':
          description: Submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateRevision' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Revision is not DRAFT
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /revisions/{revisionId}/approve:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    post:
      tags: [Templates]
      operationId: approveRevision
      summary: Approve and issue a revision. Requires step-up authentication.
      description: |
        PENDING_APPROVAL -> CURRENT. DOC_CONTROLLER. `errors/self-approval`
        (**409**, not 403 - correcting a prior documentation defect: the
        actor being the revision's own author is a conflict with the
        resource's state (INV-03), not an authorization failure) is raised
        when the approver authored the revision (PR-047).
      responses:
        '200':
          description: Revision is now current; the previous revision is superseded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateRevision' }
        '401': { $ref: '#/components/responses/Problem' }
        '403':
          description: Step-up required (`/errors/step-up-required`, PR-API-07)
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            `/errors/self-approval` - actor authored this revision (INV-03,
            PR-047), or `/errors/invalid-transition` - revision is not
            PENDING_APPROVAL
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /revisions/{revisionId}/reject:
    parameters:
      - $ref: '#/components/parameters/RevisionId'
    post:
      tags: [Templates]
      operationId: rejectRevision
      summary: Reject a pending revision. PENDING_APPROVAL -> REJECTED.
      description: DOC_CONTROLLER. Requires a reason.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10 }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TemplateRevision' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Revision is not PENDING_APPROVAL
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /jobs:
    get:
      tags: [Jobs]
      operationId: listJobs
      summary: List jobs
      description: |
        Area-scoped (PR-API-10). A MAINTAINER sees only jobs assigned to
        them; TEAM_LEADER/ENGINEER/DOC_CONTROLLER/ADMIN/AUDITOR see every
        job in their area scope (API_SPECIFICATION.md §4.1). `overdue` is
        derived at read time (PR-043), never stored.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/JobStatus' }
        - name: assignedTo
          in: query
          schema: { type: string, format: uuid }
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: overdue
          in: query
          schema: { type: boolean }
        - name: dueFrom
          in: query
          schema: { type: string, format: date }
        - name: dueTo
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Paginated jobs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/JobSummary' }
        '401': { $ref: '#/components/responses/Problem' }

  /jobs/{jobId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
    get:
      tags: [Jobs]
      operationId: getJob
      summary: Full job including the frozen template revision content
      description: |
        `templateRevision.items`/`.measurements` are the ACTIVE rows only
        (DP-3/PR-049 — the revision bound at generation, frozen). 403
        `out-of-scope` if the job's asset is outside the caller's area scope;
        403 `forbidden` if a MAINTAINER requests a job not assigned to them.
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /jobs/{jobId}/assign:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Jobs]
      operationId: assignJob
      summary: Assign or reassign a job to a technician
      description: |
        UR-029 (slice 15-SYSWIRE). TEAM_LEADER/ENGINEER/ADMIN. First
        assignment moves `SCHEDULED` -> `ASSIGNED` (PRD §5.1); reassignment
        of an `ASSIGNED` or `IN_PROGRESS` job replaces the assignee and does
        NOT change status (previously recorded results keep their original
        recorded-by attribution — the recovery path for a job whose assignee
        was deactivated). Not legal from SUBMITTED/ARCHIVED/VOIDED. The
        assignee must be an active user holding a result-recording role
        (MAINTAINER/TEAM_LEADER/ENGINEER, §4.1) whose area scope can reach
        the job. Audited in the same transaction; enqueues the UR-061
        JOB_ASSIGNED notification to the (new) assignee.
        `Idempotency-Key` is honoured when supplied but not required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignJobRequest' }
      responses:
        '200':
          description: Assigned (or reassigned)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403':
          description: |
            `/errors/out-of-scope` - the job's asset is outside the CALLER's
            area scope
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: '`/errors/invalid-transition` - job is SUBMITTED/ARCHIVED/VOIDED, or changed state concurrently'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`/errors/validation-failed` - assignee unknown, inactive, holds no result-recording role, or cannot reach the job''s area'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /jobs/{jobId}/items/{templateItemId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - name: templateItemId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
    put:
      tags: [Jobs]
      operationId: recordItemResult
      summary: Record or update a checklist item result
      description: |
        `Idempotency-Key` is REQUIRED (reachable from the offline outbox,
        PR-API-16). Upserts by `(jobId, templateItemId)`. Transitions the job
        ASSIGNED -> IN_PROGRESS on the first result (PRD §5.1). `If-Match` is
        checked against `draftVersion` when supplied.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ItemResultInput' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemResult' }
        '409':
          description: Draft version conflict, or the record is archived
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /jobs/{jobId}/measurements/{templateMeasurementId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - name: templateMeasurementId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/IfMatch'
    put:
      tags: [Jobs]
      operationId: recordMeasurementResult
      summary: Record or update a measurement reading
      description: |
        `judgement` is computed server-side from the frozen
        `template_measurement`'s specification (PR-032) — the request never
        supplies it. `Idempotency-Key` is REQUIRED (PR-API-16).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MeasurementResultInput' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementResult' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /jobs/adhoc:
    post:
      tags: [Jobs]
      operationId: createAdhocJob
      summary: Raise a job against an asset outside the maintenance plan
      description: |
        UR-028/PR-058. Roles: PLANNER, TEAM_LEADER, ENGINEER, ADMIN.
        Area-scoped (PR-API-10) - a caller with `user_area_scope` rows may
        only raise work on assets inside them.

        The asset type's CURRENT template revision is FROZEN onto the job
        exactly as a scheduler-generated job's is (DP-3/PR-049), the same
        `PM-{year}-{sequence}` number is drawn, and the asset type's approval
        route is attached - so an ad-hoc job travels the identical
        record/verify/archive path.

        It does NOT touch the plan. An ad-hoc job is created with an EMPTY
        `frequencyScope`, which is what makes it structurally incapable of
        advancing `schedule_rule.next_due_on` on completion or of being
        credited as a prior completion when a planned job is voided; and it is
        excluded from the schedule-period uniqueness key, so it neither
        blocks generation of the planned PM for that period nor collides with
        a second call-out on the same machine the same day.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAdhocJobRequest' }
      responses:
        '201':
          description: Raised
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403':
          description: '`/errors/forbidden` - role not permitted; `/errors/out-of-scope` - the asset is outside the caller''s areas'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422':
          description: |
            `/errors/validation-failed` - the asset is inactive, its form
            template has no CURRENT revision, or the assignee cannot work the
            job; or the mandatory `reason` is shorter than 10 characters.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /jobs/{jobId}/title-machine-number:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/IdempotencyKey'
    put:
      tags: [Jobs]
      operationId: recordTitleMachineNumber
      summary: Record the technician's entry for the blank in the form's title
      description: |
        Slice 31-TITLEBLANK. Eight of the twelve controlled templates carry a
        blank in their TITLE (`ED____`, `KW___`, `AVS 35-____`, CE 95 050 00
        01's bare `______`, ...). On paper the technician writes into it; this
        is that entry, captured per record like any other field on the form.

        NOT pre-filled from the machine code - deciding which part of
        `AVS35-01` belongs in `AVS 35-____` is unverifiable and wrong on two
        of the eight shapes, so the field starts empty. `null` clears a
        mistyped value; an empty string is rejected.

        Optional while drafting and offline, REQUIRED at
        `POST /jobs/{jobId}/submit` when the title carries a fillable run
        (`titleHasFillableRun`) - a form with the number already printed
        (EP01, PM01) or with no machine designation at all is never asked for
        one.

        `Idempotency-Key` is REQUIRED (reachable from the offline outbox,
        PR-API-16). UNVERSIONED, in the same shape as
        `PUT /jobs/{jobId}/parts/{partId}`: it neither accepts `If-Match` nor
        bumps `draftVersion`, and it does not transition the job's status.
        Last write wins, with no conflict prompt - and unlike a part, which is
        keyed per row, this is ONE SCALAR PER JOB, so any two concurrent
        editors of a record always collide rather than only when they touch
        the same row. What makes that acceptable is the access rule (one
        record is one assignee's to fill, and only while it is still theirs),
        not the parts precedent. See `title-machine-number.service.ts` for the
        measured reason a versioned shape was rejected: it produced
        self-inflicted 409s whenever the debounced box flushed on blur in the
        same tick as the tap that caused the blur.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TitleMachineNumberInput' }
      responses:
        '200':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '409':
          description: The record is archived, or is no longer in a capturable state
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /jobs/{jobId}/attachments:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Jobs]
      operationId: uploadAttachment
      summary: Upload a photograph. Validated by magic bytes, not extension.
      description: |
        Streamed through the api to MinIO (PR-011/ADR-007 — never presigned).
        Content is sniffed by magic bytes, never trusted from the declared
        MIME type or filename extension (S-30). Size-capped
        (`ATTACHMENT_MAX_BYTES`, S-32) and per-job-capped
        (`ATTACHMENT_MAX_PER_JOB`). `Idempotency-Key` is REQUIRED.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                itemResultId: { type: string, format: uuid }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Attachment' }
        '422': { $ref: '#/components/responses/Problem' }

  /jobs/{jobId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - name: attachmentId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Jobs]
      operationId: getAttachment
      summary: Fetch a stored attachment
      description: |
        Streamed through the api, NEVER a presigned URL (PR-011/ADR-007).
        Authorisation is evaluated on EVERY fetch, not only at upload time
        (UR-074, UR-099) — an unauthorised caller gets 403 and the object is
        never read off MinIO (S-19/I-INV-19).
      responses:
        '200':
          description: The stored image bytes
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /jobs/{jobId}/parts:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Jobs]
      operationId: recordPart
      summary: Record a part consumed on this job
      description: |
        UR-034/PR-033. No `DELETE` counterpart — BUILD_HANDOFF non-negotiable
        #7 (`bamform_app` holds no `DELETE` grant on any table, DBD §7.1);
        this supersedes API_SPECIFICATION.md §10.5's documented
        `DELETE /jobs/{id}/parts/{partId}` (see slice-6-report.md).
        `Idempotency-Key` is honoured when supplied but not required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartUsedInput' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartUsed' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /jobs/{jobId}/parts/{partId}:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - name: partId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: Idempotency-Key
        in: header
        required: true
        description: |
          Client-generated UUIDv7. REQUIRED (PR-API-16) — unlike the `POST`
          above, this route is reachable from the offline outbox.
        schema: { type: string, format: uuid }
    put:
      tags: [Jobs]
      operationId: upsertPart
      summary: Create or update a part consumed on this job, client-keyed
      description: |
        Slice 30 — additive to `POST /jobs/{jobId}/parts` above. Unlike that
        server-assigned id, the CLIENT mints `partId` up front (offline-
        friendly: a locally-created row and a network retry of the same id
        are naturally row-idempotent on their own). `Idempotency-Key` is
        REQUIRED nonetheless (PR-API-16, unlike the `POST` above) — this
        route is reachable from the offline outbox, and row-idempotency alone
        would still let a bare retry write a duplicate no-op `audit_event`.
        `active: false` is the soft-remove path (BUILD_HANDOFF non-negotiable
        #7 — no physical `DELETE`); a soft-removed part is excluded from
        reads, canonical serialisation (U-SIG-01) and the PDF.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartUpsertInput' }
      responses:
        '200':
          description: Created or updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PartUsed' }
        '404':
          description: '`/errors/not-found` - `partId` is not a UUID, or belongs to a different job'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /jobs/{jobId}/submit:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Jobs]
      operationId: submitJob
      summary: Submit a completed record for verification, signed by the performer
      description: |
        Atomic. Rejected if any mandatory item has no result. Never sent as part
        of an outbox batch - all preceding mutations for the job must be
        acknowledged first.

        Slice 18-WORKFLOW: carries the PERFORMER'S DRAWN SIGNATURE
        (`drawnSignature`, REQUIRED). The plant's process is "completed work -
        team member will sign and submit to team lead for checks"; the paper
        forms carry three signatures and the system previously captured two.
        Produces a stage-0 `approval_step` with `action = SUBMITTED` carrying
        the encrypted drawn signature PLUS a content-bound Ed25519 signature
        over the canonical record (ADR-010, the same mechanism
        `POST /jobs/{jobId}/verify` uses), so the assertion "I did this work"
        commits to the record that was submitted and is verified by
        `GET /records/{recordId}/integrity`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitJobRequest' }
      responses:
        '200':
          description: Submitted and routed to the verification queue
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '409':
          description: Job is not IN_PROGRESS (PRD §5.1) - invalid-transition
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: Mandatory items outstanding - the list is returned
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /jobs/{jobId}/verify:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Approval]
      operationId: verifyJob
      summary: Verify a record. Requires step-up. Archives on the final stage.
      description: |
        Two-stage route (ADR-011, delivered configuration: stage 1
        TEAM_LEADER, stage 2 ENGINEER — Samuel's confirmed decision). Advances
        `currentStageOrdinal` on a non-final stage; on the LAST stage,
        `SUBMITTED` -> `ARCHIVED` in the SAME transaction (PR-042/INV-13) — the
        job never rests `VERIFIED`. Produces an `approval_step` with the
        drawn signature (encrypted) PLUS a content-bound Ed25519 signature
        over the canonical record (ADR-010, PR-093/094). `onBehalfOf` (PR-076)
        names the delegator when acting under an active delegation; an
        expired/absent delegation is rejected `403`. Self-approval
        (`actor == job.submittedBy`) is rejected `409` (INV-05, PR-044,
        enforced in the service AND by a database trigger).
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyJobRequest' }
      responses:
        '200':
          description: Verified (and archived, if this was the final stage)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403':
          description: |
            `/errors/step-up-required` - re-authentication needed (PR-API-07);
            `/errors/forbidden` - actor does not hold a role eligible for this
            stage, or (S-25) no currently-active delegation permits acting on
            behalf of the named user
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: |
            `/errors/self-approval` - actor is the submitter (INV-05, S-22);
            `/errors/invalid-transition` - job is not SUBMITTED, or was
            already advanced by another verifier
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          description: '`/errors/attachment-rejected` - drawnSignature is not a valid PNG (magic-byte check)'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /jobs/{jobId}/return:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Approval]
      operationId: returnJob
      summary: Return a record to the maintainer for rework
      description: |
        `SUBMITTED` -> `IN_PROGRESS` (PR-074). TEAM_LEADER/ENGINEER. Reason
        required, >= 10 characters (INV-13). All previously entered results
        are preserved; `currentStageOrdinal` resets — a resubmission restarts
        both verification stages, since the content-bound signatures of any
        prior verify no longer describe the (about-to-be-reworked) content.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10 }
      responses:
        '200':
          description: Returned; all previously entered results are preserved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /jobs/{jobId}/recall:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Approval]
      operationId: recallJob
      summary: Submitter pulls back their own submission before verification
      description: |
        `SUBMITTED` -> `IN_PROGRESS` (PR-075, UR-051). Submitter only, only
        while `SUBMITTED`. No request body.
      responses:
        '200':
          description: Recalled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403':
          description: '`/errors/forbidden` - only the submitter may recall this record'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /jobs/{jobId}/void:
    parameters:
      - $ref: '#/components/parameters/JobId'
      - $ref: '#/components/parameters/IdempotencyKey'
    post:
      tags: [Approval]
      operationId: voidJob
      summary: Void a job. The record remains visible and queryable.
      description: |
        PR-046/INV-12. Reason required, >= 10 characters. This is NOT a
        delete (non-negotiable #7 - `bamform_app` holds no `DELETE` grant on
        any table); the job stays queryable with `status: VOIDED`.

        Legal from SCHEDULED, ASSIGNED, IN_PROGRESS or SUBMITTED
        (TEAM_LEADER/ENGINEER/ADMIN), and - since the owner's 2026-07-27
        decision (slice 17) - from ARCHIVED, ADMIN-only (403 for any other
        role). A post-archive void is an ANNOTATION, never a mutation: the
        double-signed record content, drawn signatures, Ed25519 signatures,
        content hashes and audit chain are byte-identical before and after
        (DB-enforced); only `voidReason`/`voidedBy`/`voidedAt` and the
        status change. Never legal from VERIFIED or VOIDED.

        A voided job never satisfies its schedule period and never blocks
        regeneration. Voiding an ARCHIVED job also recomputes the asset's
        schedule in the same transaction, as if that completion never
        happened: `next_due_on` re-derives from the most recent still-valid
        completion, or reverts to the voided job's own due date if none
        remains. Already-generated successor jobs are left untouched - the
        recompute affects future generation only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 10 }
      responses:
        '200':
          description: Voided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403':
          description: '`/errors/forbidden` - voiding an ARCHIVED record is ADMIN-only'
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /queue:
    get:
      tags: [Approval]
      operationId: getVerificationQueue
      summary: Records awaiting the caller's verification, including delegated queues
      description: |
        PR-073/076/081, UR-049. A record qualifies when it is `SUBMITTED`,
        the caller is not the submitter, the caller holds a role satisfying
        the CURRENT stage, and the record's area is within the caller's
        scope (or they are unrestricted). PR-076: the effective queue also
        includes any active delegator's queue (window contains now,
        resolved fresh on every request — never cached), each such entry's
        `onBehalfOf` set to that delegator's user id. Ordered by job id
        (UUIDv7, time-ordered) ascending. A non-verifier (holds none of any
        stage's roles) simply gets an empty page — not an error.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Queue ordered by age, overdue distinguished
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/QueueEntry' }

  /delegations:
    get:
      tags: [Delegations]
      operationId: listDelegations
      summary: The caller's own delegation grants, plus grants made TO them
      description: PR-038/PR-076/UR-052. No role restriction — every authenticated user may see their own delegations.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Delegations involving the caller, either direction
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Delegation' }
    post:
      tags: [Delegations]
      operationId: createDelegation
      summary: Grant delegated verification authority
      description: |
        PR-038/UR-052. Permission matrix §4.1 "Create delegation":
        TEAM_LEADER, ENGINEER, ADMIN. `createdBy` is always the authenticated
        caller (never accepted from the request body, PR-090). A
        `TEAM_LEADER`/`ENGINEER` may only delegate AWAY THEIR OWN authority
        (`delegatorId` must equal the caller); only `ADMIN` may set up a
        delegation between two other users.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateDelegationRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /delegations/{delegationId}:
    parameters:
      - $ref: '#/components/parameters/DelegationId'
    delete:
      tags: [Delegations]
      operationId: revokeDelegation
      summary: Revoke a delegation early
      description: |
        Sets `revokedAt` — does NOT delete the row (BUILD_HANDOFF
        non-negotiable #7, no hard DELETE). Permitted for ADMIN, the
        delegation's own `delegatorId`, or whoever `createdBy` it.
        Idempotent — revoking an already-revoked delegation returns it
        unchanged rather than erroring.
      responses:
        '200':
          description: Revoked (or already was)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Delegation' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /sync/bootstrap:
    get:
      tags: [Sync]
      operationId: syncBootstrap
      summary: Everything the device needs to work offline
      description: |
        Embeds the complete frozen template revision for each assigned job so the
        device can render the full form with no further network calls.
      parameters:
        - name: since
          in: query
          description: Opaque syncToken or an ISO date-time; jobs/deletedJobIds are restricted to what changed since.
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Bootstrap payload
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncBootstrap' }
        '422': { $ref: '#/components/responses/Problem' }

  /sync/outbox:
    post:
      tags: [Sync]
      operationId: syncOutbox
      summary: Drain a batch of queued offline mutations
      description: |
        Applied in client sequence order, transactionally per job. Per-mutation
        results are returned; one failure does not block the batch. Each
        mutation id doubles as its idempotency key, so replaying a batch is safe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mutations]
              properties:
                mutations:
                  type: array
                  maxItems: 200
                  items: { $ref: '#/components/schemas/OutboxMutation' }
      responses:
        '200':
          description: Per-mutation results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items: { $ref: '#/components/schemas/OutboxResult' }
                  syncToken: { type: string }
        '422': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }

  /records:
    get:
      tags: [Archive]
      operationId: listRecords
      summary: Search/filter the archive
      description: |
        UR-058 — search and filter the archive by asset, asset type,
        document number, frequency, date range (`archivedFrom`/`archivedTo`),
        technician (submitter) and approver (a verifying `approval_step`
        actor). An archived record IS a `job` row with `status = ARCHIVED`
        (this system has no separate `record` table) - or, since slice 17, a
        record voided AFTER archive (`status = VOIDED` with its untouched
        `archivedAt` still set): those stay part of the archive by default
        (an auditor must see voids, not lose them), filterable via
        `voided`. Pre-archive voids are not archive records. Area-scoped
        (PR-API-10): a MAINTAINER sees only their own records; TEAM_LEADER/
        ENGINEER/DOC_CONTROLLER/ADMIN/AUDITOR see every archived record in
        area scope (API_SPECIFICATION.md §4.1 "View archive").
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: assetId
          in: query
          schema: { type: string, format: uuid }
        - name: assetTypeId
          in: query
          schema: { type: string, format: uuid }
        - name: documentNumber
          in: query
          schema: { type: string }
        - name: frequency
          in: query
          schema: { $ref: '#/components/schemas/Frequency' }
        - name: archivedFrom
          in: query
          schema: { type: string, format: date }
        - name: archivedTo
          in: query
          schema: { type: string, format: date }
        - name: technician
          in: query
          schema: { type: string, format: uuid }
        - name: approver
          in: query
          schema: { type: string, format: uuid }
        - name: voided
          in: query
          description: Omitted - whole archive INCLUDING voided-archived records; `true` - only voided-archived; `false` - exclude them.
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated archived records
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/JobSummary' }

  /records/{recordId}:
    parameters:
      - name: recordId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Archive]
      operationId: getRecord
      summary: Retrieve one archived record in full
      description: 404 if the job does not exist or is not ARCHIVED; 403 out-of-scope/forbidden per the same area/role rule as `GET /records`.
      responses:
        '200':
          description: Record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Job' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /records/{recordId}/pdf:
    parameters:
      - name: recordId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Archive]
      operationId: getRecordPdf
      summary: Render the record in the controlled paper form layout
      description: |
        PR-116/117/118, UR-056/057. Rendered server-side from an HTML
        template via headless Chromium ON THE WORKER (never blocking `api`);
        the footer carries the record id and its integrity digest (the
        SAME `approval_step.content_hash` `GET /records/{recordId}/integrity`
        checks — never a separately invented value). 409
        `pdf-not-yet-available` if the record has never been through any
        approval action (no digest exists yet to print).
      responses:
        '200':
          description: PDF
          content:
            application/pdf:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /records/{recordId}/integrity:
    parameters:
      - name: recordId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Archive]
      operationId: verifyRecordIntegrity
      summary: Recompute the content hash and verify the signature
      description: |
        Recomputes the canonical serialisation from current data, re-derives the
        digest, compares it to the stored value and verifies the Ed25519
        signature. This is the mechanism behind acceptance criterion AC-11.
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IntegrityResult' }
        '404': { $ref: '#/components/responses/Problem' }

  /records/export:
    post:
      tags: [Archive]
      operationId: requestRecordExport
      summary: Request an asynchronous export of a record set
      description: |
        PR-119/UR-059. Async — returns immediately with `status: PENDING`;
        poll `GET /exports/{exportId}`. The filter (or explicit `recordIds`)
        is resolved to a concrete, scoped record-id snapshot at REQUEST
        TIME, using the caller's own area/role scope — an id outside scope
        is silently excluded, never leaked via a 403/404. `JOB_VIEW_ALL_ROLES`
        only (API_SPECIFICATION.md §4.1 "Export records" — MAINTAINER is
        NOT granted this, unlike "View archive").
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecordExportRequest' }
      responses:
        '202':
          description: Export accepted, processing asynchronously
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordExportStatus' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /exports/{exportId}:
    parameters:
      - name: exportId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Archive]
      operationId: getExportStatus
      summary: Poll an export job's status
      description: Authorised to the REQUESTER only — not re-scoped by the requester's CURRENT area/role (a snapshot taken earlier remains visible to whoever asked for it).
      responses:
        '200':
          description: Export status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecordExportStatus' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /exports/{exportId}/download:
    parameters:
      - name: exportId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Archive]
      operationId: downloadExport
      summary: Download the finished export ZIP
      description: |
        ADR-007 — streamed through `api`, authorised on EVERY fetch, never
        a presigned URL. A ZIP of the rendered PDFs plus a `manifest.csv`
        (PR-119). 404 if the export is not yet `DONE`.
      responses:
        '200':
          description: ZIP archive
          content:
            application/zip:
              schema: { type: string, format: binary }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /reports/measurements:
    get:
      tags: [Reports]
      operationId: getMeasurementTrend
      summary: Measurement trend series for an asset
      description: |
        Returns readings over time for one measurement identity on one asset,
        joined across template revisions by stable key.
      parameters:
        - name: assetId
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: stableKey
          in: query
          required: true
          schema: { type: string }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Trend series with the specification band
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MeasurementTrend' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /reports/compliance:
    get:
      tags: [Reports]
      operationId: getComplianceReport
      summary: Due vs. completed on time, grouped by area
      description: UR-067. Defaults to the last 90 days ending today when `from`/`to` are omitted.
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: areaId
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Compliance report
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplianceReport' }
        '403': { $ref: '#/components/responses/Problem' }

  /reports/overdue:
    get:
      tags: [Reports]
      operationId: getOverdueReport
      summary: Currently overdue jobs
      description: UR-068. Reuses the same derived overdue rule as `GET /jobs?overdue=true` (PR-043 — never stored).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated overdue jobs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/JobSummary' }

  /reports/pending:
    get:
      tags: [Reports]
      operationId: getPendingVerificationReport
      summary: Submitted jobs awaiting verification, with ageing
      description: UR-068. Every SUBMITTED job in scope (not only ones the caller personally can verify — contrast with `GET /queue`).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated pending-verification jobs
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PendingVerificationEntry' }

  /audit-events/chain-status:
    get:
      tags: [Audit]
      operationId: getAuditChainStatus
      summary: Verify the hash chain over the audit log
      description: |
        Walks `audit_event` ordered by `sequence`, recomputes each row's hash
        using the exact formula the slice-1 database trigger
        (`compute_audit_event_hash_chain`) applies at insert time, and
        checks `prev_hash` linkage. Runs on demand (recompute), the same
        design as `GET /records/{recordId}/integrity`. `AUDITOR`/`ADMIN`
        only (SECURITY_ARCHITECTURE.md §4.2 P2, PR-097/PR-099).

        CAVEAT — cannot detect tail-truncation: this check detects mutated
        fields, broken hash links, and deletion of a row from the middle or
        head of the chain (the next surviving row's `prev_hash` stops
        matching). It CANNOT detect deletion of the most-recent events — a
        truncated tail leaves the remaining chain fully self-consistent, so
        `intact: true` does not rule that out. The application database role
        is denied `DELETE` on `audit_event`, so this is not exploitable via a
        compromised API (in-scope threat E-8 is already blocked); truncation
        by a database-owner/superuser is only detectable with an external
        (off-box) anchor for the chain head, which is tracked as future work
        and not implemented by this endpoint.
      responses:
        '200':
          description: Chain verification result
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuditChainStatus' }
        '403': { $ref: '#/components/responses/Problem' }

  /users:
    get:
      tags: [Admin]
      operationId: listUsers
      summary: List users
      description: ADMIN only (API_SPECIFICATION.md §10.9, UR-072).
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
        - name: roleCode
          in: query
          schema: { $ref: '#/components/schemas/RoleCode' }
        - name: active
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      tags: [Admin]
      operationId: createUser
      summary: Create a user
      description: |
        ADMIN only. `fullName`/`email`/`employeeId` are encrypted + blind-
        indexed (PR-106/107/108) — same real crypto path as `/auth/login`.
        `password` is admin-set (this slice's documented minimal mechanism —
        no invite/temp-password email flow exists yet). Rejects a duplicate
        `email` (blind-index uniqueness) with 409.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '409':
          description: Duplicate email
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /users/{userId}:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [Admin]
      operationId: getUser
      summary: Get a user
      description: ADMIN only.
      responses:
        '200':
          description: User
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      tags: [Admin]
      operationId: updateUser
      summary: Update a user. Deactivation only, never deletion.
      description: |
        ADMIN only (UR-075). `active: false` is the only removal mechanism.
        `roleCodes`, when present, REPLACES the role set (produces a
        `permission_change` audit event, distinct from `update`).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409':
          description: Duplicate email
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /users/{userId}/area-scopes:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      tags: [Admin]
      operationId: setUserAreaScopes
      summary: Set (replace) a user's area scopes
      description: |
        ADMIN only (slice 13-UI-B, SYS-10 — the write path that makes
        PR-API-10's repository-layer scoping reachable). REPLACES the user's
        area-scope set wholesale, the same way `PATCH /users/{userId}`'s
        `roleCodes` replaces roles. `[]` clears every scope (the user
        becomes unrestricted). A dropped scope is soft-removed
        (`user_area_scope.active = false` — INV-16: no DELETE grant), and a
        change produces a `permission_change` audit event in the same
        transaction (INV-09). The payload carries area ids only — never any
        person-field (CR-5/PR-SEC-02).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserAreaScopeSet' }
      responses:
        '200':
          description: Updated user, `areaIds` reflecting the new set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '422':
          description: Unknown areaId, or malformed body
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /users/{userId}/mfa-reset:
    parameters:
      - name: userId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Admin]
      operationId: resetUserMfa
      summary: Reset a user's multi-factor enrolment
      description: |
        ADMIN only. Clears the user's TOTP enrolment and marks every unused
        recovery code used, forcing a fresh enrolment on next login. Audited
        as `mfa_reset` with both actor and subject.

        An administrator can reset but can never READ - no endpoint discloses
        anyone's TOTP secret or recovery codes.
      responses:
        '204': { description: MFA reset }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /roles:
    get:
      tags: [Admin]
      operationId: listRoles
      summary: List the role catalogue
      description: UR-073. Any authenticated user — seeded reference data, not ADMIN-restricted.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Paginated roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
        '401': { $ref: '#/components/responses/Problem' }

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Ed25519-signed access token, 15 minute TTL

  parameters:
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Cursor:
      name: cursor
      in: query
      description: Opaque. Clients must not construct or parse it.
      schema: { type: string }
    AssetId:
      name: assetId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ScheduleRuleId:
      name: scheduleRuleId
      in: path
      required: true
      description: A `schedule_rule` id, as `GET /schedule` returns on every row.
      schema: { type: string, format: uuid }
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: string, format: uuid }
    RevisionId:
      name: revisionId
      in: path
      required: true
      schema: { type: string, format: uuid }
    DelegationId:
      name: delegationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: Client-generated UUIDv7. Required on endpoints reachable from the offline outbox.
      schema: { type: string, format: uuid }
    IfMatch:
      name: If-Match
      in: header
      description: The job draftVersion the client based this mutation on.
      schema: { type: string }

  responses:
    Problem:
      description: |
        RFC 9457 Problem Details.

        Note for every AUTHENTICATED operation in this document, whether or
        not it lists a 403: since slice 13-MFA a user whose
        `must_change_password` flag is set receives
        `403 /errors/password-change-required` from ANY endpoint other than
        `GET /auth/me`, `POST /auth/password` and `POST /auth/logout`, until
        they change their password. It is a global deny-by-default guard, not
        a per-endpoint rule, so it is documented once here rather than
        repeated on ~60 operations. Clients should handle that `type`
        globally.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:

    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        requestId: { type: string }
        errors:
          type: array
          items:
            type: object
            properties:
              pointer: { type: string }
              code: { type: string }
              message: { type: string }
      examples:
        - type: https://form.bevorasg.com/errors/incomplete-record
          title: Record is incomplete
          status: 422
          detail: 3 mandatory items have no recorded status.
          requestId: 01JQ8X2N
          errors:
            - pointer: /items/9
              code: REQUIRED
              message: Item 9 has no recorded status

    Page:
      type: object
      required: [page]
      properties:
        page:
          type: object
          required: [hasMore, limit]
          properties:
            nextCursor: { type: [string, 'null'] }
            hasMore: { type: boolean }
            limit: { type: integer }
            total: { type: [integer, 'null'], description: Present only when includeTotal=true }

    Frequency:
      type: string
      enum: [M1, M3, M6, Y]

    AssetStatus:
      type: string
      enum: [ACTIVE, UNDER_REPAIR, DECOMMISSIONED]

    JobStatus:
      type: string
      enum: [SCHEDULED, ASSIGNED, IN_PROGRESS, SUBMITTED, VERIFIED, ARCHIVED, VOIDED]

    ItemStatus:
      type: string
      enum: [DONE, NOT_APPLICABLE, NOT_DONE]

    SpecType:
      type: string
      enum: [RANGE, TOLERANCE, PASS_FAIL, TEXT]

    Judgement:
      type: string
      enum: [PASS, FAIL, NOT_EVALUATED]

    AuthResult:
      type: object
      required: [accessToken, expiresIn, user]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: Seconds }
        user: { $ref: '#/components/schemas/CurrentUser' }

    # ------------------------------------------------- slice 13-MFA (§§4-5, §7)
    #
    # Every schema below mirrors the Zod DTO in `shared/src/mfa.ts` exactly,
    # required-vs-optional included (ADR-002, and the standing CI rule that
    # openapi must match the DTO the server actually validates against - job 5
    # checks structure, not live conformance, so this correspondence is
    # maintained by hand and reviewed).

    MfaChallenge:
      type: object
      description: |
        The alternative 200 body of `POST /auth/login`. No access token and no
        refresh cookie accompany it.

        `challengeToken` is a TOKEN and BUILD_HANDOFF non-negotiable #10
        applies to it in full: the client holds it in memory only and must
        never write it to `localStorage`/`sessionStorage`. It is valid for 5
        minutes, is single-use, authorises only `/auth/mfa/*`, and can never
        be presented as an access token (distinct audience and `typ`).
      required: [mfaRequired, mfaEnrolled, challengeToken, expiresIn]
      properties:
        mfaRequired: { type: boolean, const: true }
        mfaEnrolled:
          type: boolean
          description: False means the client must run enrolment before it can complete the login.
        challengeToken: { type: string }
        expiresIn: { type: integer, description: Seconds }

    MfaEnrolRequest:
      type: object
      properties:
        challengeToken:
          type: string
          description: Present when enrolling mid-login; absent when an already-signed-in user enrols with a Bearer access token.

    MfaEnrolResponse:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret:
          type: string
          description: Base32 (RFC 4648, unpadded) shared secret, for manual entry.
        otpauthUri:
          type: string
          description: "`otpauth://totp/...` - the same secret in the form a QR code encodes. HMAC-SHA1, 6 digits, 30 s period."

    MfaEnrolConfirmRequest:
      type: object
      required: [totpCode]
      properties:
        totpCode: { type: string, description: The 6-digit code from the authenticator app. }
        challengeToken: { type: string }

    MfaEnrolConfirmResponse:
      type: object
      required: [recoveryCodes, auth]
      properties:
        recoveryCodes:
          type: array
          description: Ten single-use codes, returned exactly once and never retrievable again.
          items: { type: string }
        auth:
          description: Non-null only when this call completed a login challenge; null for a voluntary enrolment.
          oneOf:
            - $ref: '#/components/schemas/AuthResult'
            - type: 'null'

    MfaVerifyRequest:
      type: object
      required: [challengeToken, totpCode]
      properties:
        challengeToken: { type: string }
        totpCode: { type: string, description: The 6-digit code from the authenticator app. }

    MfaRecoveryRequest:
      type: object
      required: [challengeToken, recoveryCode]
      properties:
        challengeToken: { type: string }
        recoveryCode: { type: string, description: One of the single-use recovery codes issued at enrolment. }

    PasswordChangeRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password, minLength: 12 }

    CurrentUser:
      type: object
      required: [id, fullName, roles]
      properties:
        id: { type: string, format: uuid }
        fullName: { type: string }
        email: { type: string, format: email }
        roles:
          type: array
          items: { type: string }
        areaScope:
          type: array
          items: { type: string, format: uuid }
        activeDelegations:
          type: array
          items:
            type: object
            properties:
              delegatorId: { type: string, format: uuid }
              delegatorName: { type: string }
              validTo: { type: string, format: date-time }
        stepUpValidUntil: { type: [string, 'null'], format: date-time }

    Asset:
      type: object
      required: [id, code, assetTypeId, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [AW03] }
        assetTypeId: { type: string, format: uuid }
        assetTypeName: { type: string }
        description: { type: [string, 'null'] }
        manufacturer: { type: [string, 'null'] }
        model: { type: [string, 'null'] }
        serialNumber: { type: [string, 'null'] }
        areaId: { type: [string, 'null'], format: uuid }
        locationDetail: { type: [string, 'null'] }
        commissionedOn: { type: [string, 'null'], format: date }
        scheduleAnchorDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/AssetStatus' }
        active: { type: boolean }
        codeProvisional:
          type: boolean
          description: |
            Slice 13a / B-09: `true` when `code` was auto-generated (the
            admin did not supply one) and not yet confirmed — the UI renders
            this "RED". Cleared the moment an admin changes `code`.

    AssetCreate:
      type: object
      required: [assetTypeId, scheduleAnchorDate]
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          description: Optional — omit to have the server auto-generate a provisional/"RED" code (B-09).
        assetTypeId: { type: string, format: uuid }
        description: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        serialNumber: { type: string }
        areaId: { type: string, format: uuid }
        locationDetail: { type: string }
        commissionedOn: { type: string, format: date }
        scheduleAnchorDate: { type: string, format: date }

    AssetUpdate:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 50
          description: Changing this confirms an auto-generated code — clears `codeProvisional`.
        description: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        areaId:
          type: [string, 'null']
          format: uuid
          description: |
            Slice 13-UI-B (review B-1) — explicit `null` CLEARS the area
            assignment (moves the machine out of every scoped area's
            visibility); omitting the field leaves it unchanged.
        locationDetail: { type: string }
        status: { $ref: '#/components/schemas/AssetStatus' }
        active: { type: boolean }

    RoleCode:
      type: string
      description: |
        The closed set `role.code` holds — seeded by migration, not created
        through the API (UR-073). `PLANNER` is the slice-18-WORKFLOW addition
        (the maintenance planner who plans the PM schedule and raises work);
        it is ADDITIVE — no member was removed or renamed.
      enum: [MAINTAINER, PLANNER, TEAM_LEADER, ENGINEER, DOC_CONTROLLER, ADMIN, AUDITOR]

    Role:
      type: object
      required: [id, code, name]
      properties:
        id: { type: string, format: uuid }
        code: { $ref: '#/components/schemas/RoleCode' }
        name: { type: string }
        description: { type: [string, 'null'] }

    UserStatus:
      type: string
      enum: [ACTIVE, SUSPENDED, DEACTIVATED]

    User:
      type: object
      required: [id, fullName, email, status, active, roles, areaIds, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        employeeId: { type: [string, 'null'] }
        fullName: { type: string }
        email: { type: string, format: email }
        status: { $ref: '#/components/schemas/UserStatus' }
        active: { type: boolean }
        roles:
          type: array
          items: { $ref: '#/components/schemas/RoleCode' }
        areaIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            Slice 13-UI-B (SYS-10) — the user's ACTIVE area scopes
            (PR-API-10). `[]` means UNRESTRICTED (sees every area). Written
            via `PUT /users/{userId}/area-scopes`; soft-removed scopes never
            appear here.
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    UserCreate:
      type: object
      required: [fullName, email, password, roleCodes]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        employeeId: { type: string, minLength: 1, maxLength: 50 }
        password:
          type: string
          minLength: 12
          description: Admin-set initial password (this slice's documented minimal mechanism). Never returned by any endpoint.
        roleCodes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RoleCode' }

    UserUpdate:
      type: object
      properties:
        fullName: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, format: email }
        active: { type: boolean }
        roleCodes:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/RoleCode' }

    UserAreaScopeSet:
      type: object
      required: [areaIds]
      properties:
        areaIds:
          type: array
          items: { type: string, format: uuid }
          description: |
            REPLACES the user's area-scope set wholesale (the
            `UserUpdate.roleCodes` convention). `[]` is legal and clears
            every scope — the user becomes unrestricted. Removal is a
            soft-remove (`user_area_scope.active = false`, INV-16: no
            DELETE grant); produces a `permission_change` audit event.

    ScheduleRule:
      type: object
      required: [id, assetDocumentId, assetId, frequency, intervalMonths, anchorDate, nextDueOn, active]
      properties:
        id: { type: string, format: uuid }
        assetDocumentId:
          type: string
          format: uuid
          description: |
            Slice 27-ASSETDOC. A rule hangs off a DOCUMENT, not a machine —
            that is what lets one machine carry a monthly pH-meter check AND
            its monthly preventive maintenance.
        assetId:
          type: string
          format: uuid
          description: Derived from the document. Kept so every existing reader still works.
        frequency: { $ref: '#/components/schemas/Frequency' }
        intervalMonths: { type: integer, examples: [1, 3, 6, 12] }
        anchorDate: { type: string, format: date }
        lastCompletedOn: { type: [string, 'null'], format: date }
        nextDueOn: { type: string, format: date }
        adjustedReason: { type: [string, 'null'] }
        active: { type: boolean }

    PlannerScheduleRow:
      type: object
      description: |
        Slice 31-PLANNER — one `schedule_rule` as the cross-machine planner
        grid needs it: the machine (the grid's row header), the document, the
        rule, every date it falls due inside the requested window, and what
        one visit of it actually carries.

        Mirrors `plannerScheduleRowSchema` in `shared/src/planner.ts` exactly
        (ADR-002). It carries the same `id`/`assetDocumentId`/`frequency`
        identity `ScheduleRule` does, so a row read here is adjusted through
        the existing `PUT /assets/{assetId}/schedule` — one write path, not
        two.
      required:
        [
          id,
          assetId,
          assetCode,
          assetDocumentId,
          documentNumber,
          documentTitle,
          frequency,
          intervalMonths,
          nextDueOn,
          active,
          plannedDates,
          cascadeFrequencies,
          nextDueJob,
          jobGenerationOpensOn,
          defaultAssignee,
        ]
      properties:
        id:
          type: string
          format: uuid
          description: The `schedule_rule` id — the same identity `GET /assets/{assetId}/schedule` returns.
        assetId: { type: string, format: uuid }
        assetCode: { type: string, examples: [AW09, WB12] }
        assetDescription: { type: [string, 'null'] }
        areaId: { type: [string, 'null'], format: uuid }
        assetDocumentId: { type: string, format: uuid }
        documentNumber: { type: string, examples: ['CE 95 020 00 03'] }
        documentTitle:
          type: string
          description: |
            The document's title with its fillable run substituted, exactly as
            `GET /assets/{assetId}/documents` resolves it. Derived at read
            time, never stored resolved.
        frequency: { $ref: '#/components/schemas/Frequency' }
        intervalMonths: { type: integer, examples: [1, 3, 6, 12] }
        nextDueOn: { type: string, format: date }
        lastCompletedOn: { type: [string, 'null'], format: date }
        adjustedReason: { type: [string, 'null'] }
        active: { type: boolean }
        plannedDates:
          type: array
          items: { type: string, format: date }
          description: |
            Every date inside the requested window this rule falls due on,
            ascending: `nextDueOn`, then `nextDueOn + n·intervalMonths`
            (calendar months, clamped to month end) while the result stays in
            the window.

            A PROJECTION, not a promise — completion, voiding or a manual
            adjustment moves `nextDueOn` and every later visit with it
            (ADR-009). MAY BE EMPTY when the rule's interval steps clean over
            a short window; the row is still returned so the caller can see
            the machine has a rule at all.
        cascadeFrequencies:
          type: array
          items: { $ref: '#/components/schemas/Frequency' }
          description: |
            What ONE visit of this rule carries: the union of every frequency
            on the SAME document whose interval divides this rule's (PR-053
            frequency cascade). A yearly visit subsumes the 6M, 3M and 1M
            items, so it is materially heavier than a monthly one — which is
            what lets a planner weigh a week's load instead of counting cells.

            Computed from the rules that actually exist on the document, not
            from divisibility alone (U-CAS-05).
        defaultAssignee:
          oneOf:
            - $ref: '#/components/schemas/PlannerDefaultAssignee'
            - type: 'null'
          description: |
            WHO NORMALLY DOES THIS PM — `schedule_rule.default_assignee_id`,
            or `null` where nobody is named and every generated job therefore
            arrives unassigned. Set with
            `PUT /schedule/{scheduleRuleId}/default-assignee`.

            Distinct from `nextDueJob.assignedTo`: this is the PLAN (affects
            jobs not yet generated), that is ONE OCCURRENCE (affects that job).
            Neither write touches the other.
        nextDueJob:
          oneOf:
            - $ref: '#/components/schemas/PlannerVisitJob'
            - type: 'null'
          description: |
            Slice 32-PLANNERJOB — the job the scheduler has already raised for
            this rule's STORED `nextDueOn`, or `null` when it has not raised
            one yet. This is how a planner reaches the form a technician
            actually fills.

            Belongs to `nextDueOn` only. Every other date in `plannedDates` is
            a projection of it; job generation reads `schedule_rule.next_due_on`
            and nothing else, so a projected visit has no job and cannot have
            one until it becomes the stored date.

            Identified by the tuple `(assetDocumentId, frequency, dueOn)` —
            the same key as `job`'s partial unique index
            `(asset_document_id, frequency_scope, due_on) WHERE status <>
            'voided' AND is_adhoc = false`, reached through the columns a
            schedule row can vouch for (`schedule_rule` is unique on
            `(asset_document_id, frequency)`). A VOIDED job is never returned
            (it releases its period, so a replacement is still to come) and
            neither is an AD-HOC one (UR-028 — empty `frequency_scope`,
            structurally unable to advance `next_due_on`).
        jobGenerationOpensOn:
          type: string
          format: date
          description: |
            The earliest date on which a scheduler sweep will raise the job for
            `nextDueOn`: `nextDueOn` minus this machine's effective lead time
            (`asset_type.leadTimeDays`, falling back to the deployment's
            `DEFAULT_LEAD_TIME_DAYS`).

            Sent because a client cannot know it — the lead time is per asset
            type over a server-configured default. It is a BOUNDARY, not an
            appointment: the sweep runs on its own cron, so the job appears on
            the first sweep on or after this date. It also promises nothing
            about whether a job will be raised at all — a document with no
            current revision, or no active items in scope, is skipped.

    PlannerDefaultAssignee:
      # Mirrors shared/src/planner.ts `plannerDefaultAssigneeSchema` exactly.
      type: object
      description: |
        Slice 32-PLANNERJOB — the technician `JobGenerationService` hands each
        job generated from this schedule rule to.
      required: [id, fullName, eligibility]
      properties:
        id: { type: string, format: uuid }
        fullName:
          type: string
          description: Decrypted at read time — `app_user.full_name` is application-layer encrypted (DBD §6.2).
        eligibility:
          type: string
          enum: [assignable, not-assignable, unknown]
          description: |
            Whether this person would STILL be accepted for this machine
            today: active, holding a result-recording role, and area-scoped to
            reach it.

            Sent rather than left for the sweep to discover, because
            eligibility lapses silently and usually will. At `not-assignable`
            the next sweep generates an UNASSIGNED job (it does not refuse —
            the job is the controlled record), so a planner needs to see it
            before the work goes out with nobody on it.

            THREE VALUES, NOT A BOOLEAN. The check reads three tables, and
            when one of those reads fails there is no honest boolean: `false`
            would assert that a named person is not eligible, which the server
            has not established. `unknown` says the check could not be
            completed — a fact about the system, not about the person.

    SetDefaultAssigneeRequest:
      # Mirrors shared/src/planner.ts `setDefaultAssigneeRequestSchema` exactly.
      type: object
      required: [defaultAssigneeId]
      properties:
        defaultAssigneeId:
          type: [string, 'null']
          format: uuid
          description: |
            The standing assignee, or `null` to clear it. Explicitly nullable
            rather than optional: "leave it alone" and "there is nobody" are
            different intentions and an optional field cannot express the
            second.

    SetDefaultAssigneeResult:
      # Mirrors shared/src/planner.ts `setDefaultAssigneeResultSchema` exactly.
      type: object
      required: [scheduleRuleId, defaultAssignee]
      properties:
        scheduleRuleId: { type: string, format: uuid }
        defaultAssignee:
          oneOf:
            - $ref: '#/components/schemas/PlannerDefaultAssignee'
            - type: 'null'

    PlannerVisitJob:
      type: object
      description: |
        Slice 32-PLANNERJOB — a HANDLE on the job raised for a planned visit:
        enough to name it, say what state it is in, and open it. Deliberately
        not a `JobSummary`: duplicating one into the planner grid would make
        the plan a second, staler view of the work list.
      required: [id, jobNumber, status, assignedTo, assignedToName]
      properties:
        id: { type: string, format: uuid }
        jobNumber: { type: string, examples: ['PM-2026-000123'] }
        status: { $ref: '#/components/schemas/JobStatus' }
        assignedTo:
          type: [string, 'null']
          format: uuid
          description: |
            Who is responsible for doing it, or `null` while nobody is. A
            scheduler-generated job is born unassigned and is invisible to the
            MAINTAINER who should do it (a MAINTAINER sees only jobs assigned
            to them), so "due, and nobody has it" is the state a planner is
            scanning for.
        assignedToName:
          type: [string, 'null']
          description: |
            The assignee's name, decrypted at read time — an id names nobody.
            `null` exactly when `assignedTo` is. The only personal field on
            this row.

    ScheduleAdjust:
      type: object
      required: [frequency, nextDueOn, adjustedReason]
      properties:
        assetDocumentId:
          type: string
          format: uuid
          description: |
            Slice 27-ASSETDOC. Optional only where there is nothing to choose —
            a machine carrying one document. Where it carries several, this is
            REQUIRED: `(assetId, frequency)` no longer identifies a rule, and
            the server returns 422 rather than adjusting an arbitrary
            document's schedule.
        frequency: { $ref: '#/components/schemas/Frequency' }
        nextDueOn: { type: string, format: date }
        adjustedReason: { type: string, minLength: 10 }

    Area:
      type: object
      required: [id, code, name, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        parentId: { type: [string, 'null'], format: uuid }
        active: { type: boolean }

    AreaCreate:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1 }
        parentId: { type: string, format: uuid }

    AreaUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        parentId: { type: [string, 'null'], format: uuid }
        active: { type: boolean }

    AssetType:
      # Slice 27-ASSETDOC removed `formTemplateId`. It was UNIQUE, which made
      # the machine->form relation one-to-one in BOTH directions: a machine
      # family could hold one document, and a document could serve one machine
      # family. An asset type is now purely the machine-family grouping (the
      # approval route and the lead time); the route from a machine to a form
      # is `asset_document` — see AssetDocument.
      type: object
      required: [id, code, name, approvalRouteId, leadTimeDays, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        approvalRouteId: { type: string, format: uuid }
        leadTimeDays: { type: integer }
        active: { type: boolean }

    AssetTypeCreate:
      type: object
      required: [code, name, approvalRouteId]
      properties:
        code: { type: string, minLength: 1, maxLength: 50 }
        name: { type: string, minLength: 1 }
        description: { type: string }
        approvalRouteId: { type: string, format: uuid }
        leadTimeDays: { type: integer, minimum: 1 }

    AssetTypeUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        description: { type: [string, 'null'] }
        leadTimeDays: { type: integer, minimum: 1 }
        active: { type: boolean }

    AssetDocument:
      # Slice 27-ASSETDOC. `title`, `resolvedTitle` and `titleHasFillableRun`
      # are DERIVED per response from the template's current title, never
      # stored — so a revision that changes the title stays correct. Slice
      # 23-PDFA freezes the rendered result at archive, so a signed record
      # keeps the title it was signed under.
      type: object
      required:
        [id, assetId, formTemplateId, documentNumber, title, resolvedTitle,
         titleHasFillableRun, machineNumber, active]
      properties:
        id: { type: string, format: uuid }
        assetId: { type: string, format: uuid }
        formTemplateId: { type: string, format: uuid }
        documentNumber: { type: string, examples: ['CE 95 020 00 03'] }
        title:
          type: string
          description: The template's stored title, blank and all.
          examples: ['KNS Wire Bond Preventive Maintenance Record KW___']
        resolvedTitle:
          type: string
          description: |
            The title with `machineNumber` substituted into its blank. With no
            machineNumber the blank stays intact, exactly as the paper form
            reads before someone writes on it.
          examples: ['KNS Wire Bond Preventive Maintenance Record KW13']
        titleHasFillableRun:
          type: boolean
          description: |
            Whether the title carries a run of two or more underscores. The
            admin screen keys its form-number field off this, so an admin is
            never offered a box that does nothing and can never believe they
            have labelled a form when they have not. True for 8 of the 12 real
            templates; false for the fixed EP01/PM01 titles and the two with no
            machine designation at all.
        machineNumber:
          type: [string, 'null']
          description: |
            Fills the blank. NULL is always valid and never a validation error.
          examples: ['13']
        active: { type: boolean }

    AssetDocumentCreate:
      type: object
      required: [formTemplateId]
      properties:
        formTemplateId: { type: string, format: uuid }
        machineNumber:
          type: [string, 'null']
          minLength: 1
          maxLength: 50
          description: |
            Never required, whatever the title looks like. Supplied for a title
            with no blank it is simply stored and has nothing to substitute
            into (owner, 2026-07-29: "Is ok some forms are already pre updated
            just allow user to choose").

    AssetDocumentUpdate:
      type: object
      properties:
        machineNumber: { type: [string, 'null'], minLength: 1, maxLength: 50 }
        active:
          type: boolean
          description: |
            `false` retires the document — the only removal there is (INV-16).

    FormTemplate:
      type: object
      required: [id, documentNumber, title, active]
      properties:
        id: { type: string, format: uuid }
        documentNumber: { type: string, examples: ['CE 95 020 00 01'] }
        title: { type: string }
        active: { type: boolean }
        # Slice 27-ASSETDOC removed `assetTypeId` — the reverse of
        # `asset_type.form_template_id UNIQUE`. A document no longer belongs to
        # one machine family; which machines carry it is
        # GET /assets/{assetId}/documents.
        currentRevisionId:
          type: [string, 'null']
          format: uuid
          description: Resolves to null if no revision has ever been approved

    CreateTemplateRequest:
      type: object
      required: [documentNumber, title]
      properties:
        documentNumber: { type: string, minLength: 1, examples: ['CE 95 020 00 01'] }
        title: { type: string, minLength: 1 }

    ApprovalRoute:
      type: object
      required: [id, code, name, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ['TWO_STAGE_TL_THEN_ENG'] }
        name: { type: string }
        active: { type: boolean }

    TemplateRevision:
      type: object
      required: [id, formTemplateId, revisionCode, sequenceOrdinal, status]
      properties:
        id: { type: string, format: uuid }
        formTemplateId: { type: string, format: uuid }
        documentNumber: { type: string, examples: ['CE 95 020 00 01'] }
        title: { type: string }
        revisionCode: { type: string, examples: [C] }
        sequenceOrdinal: { type: integer }
        status:
          type: string
          enum: [DRAFT, PENDING_APPROVAL, CURRENT, SUPERSEDED, REJECTED]
        changeDescription: { type: string }
        standingContent: { $ref: '#/components/schemas/StandingContent' }
        authoredBy: { type: string, format: uuid }
        authoredByName: { type: string }
        approvedBy: { type: [string, 'null'], format: uuid }
        approvedByName: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        rejectedReason: { type: [string, 'null'] }
        effectiveFrom: { type: [string, 'null'], format: date-time }
        supersededAt: { type: [string, 'null'], format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/TemplateItem' }
        measurements:
          type: array
          items: { $ref: '#/components/schemas/TemplateMeasurement' }

    StandingContent:
      type: object
      properties:
        specialTools: { type: [string, 'null'] }
        partsRequired:
          type: array
          items:
            type: object
            properties:
              partNo: { type: string }
              description: { type: string }
              qty: { type: string }
              remarks: { type: string }
        ppe:
          type: array
          items: { type: string }
        safety: { type: [string, 'null'] }
        procedure: { type: [string, 'null'] }
        remarks: { type: [string, 'null'] }
        frequencyBanner:
          type: string
          nullable: true
          description: >-
            The form's printed frequency banner, verbatim. Reproduced on the
            printed record's selection band. Not derivable from item
            frequencies.
        cascadeOverride: { type: [object, 'null'], additionalProperties: true }

    TemplateItem:
      type: object
      required: [id, itemNo, frequency, instruction, mandatory, stableKey]
      properties:
        id: { type: string, format: uuid }
        itemNo: { type: integer }
        frequency: { $ref: '#/components/schemas/Frequency' }
        instruction: { type: string }
        mandatory: { type: boolean }
        stableKey: { type: string }
        displayOrder: { type: integer }

    TemplateItemInput:
      type: object
      required: [itemNo, frequency, instruction]
      description: |
        `PUT /revisions/{id}/items` request element - never accepts `id`
        (server-assigned) or `active` (server-internal, always true in any
        response). `stableKey` is optional: a genuinely new item doesn't
        require the caller to mint one; re-sending an existing item's
        stableKey is how PR-028 carry-forward/reactivation is expressed.
      properties:
        itemNo: { type: integer, minimum: 1 }
        frequency: { $ref: '#/components/schemas/Frequency' }
        instruction: { type: string, minLength: 1 }
        mandatory: { type: boolean, default: true }
        stableKey: { type: string, minLength: 1 }
        displayOrder: { type: integer }

    TemplateMeasurement:
      type: object
      required: [description, specType, specDisplay, stableKey]
      properties:
        id: { type: string, format: uuid }
        section: { type: [string, 'null'] }
        description: { type: string }
        unit: { type: [string, 'null'], examples: ['°C'] }
        specType: { $ref: '#/components/schemas/SpecType' }
        lowerLimit: { type: [number, 'null'] }
        upperLimit: { type: [number, 'null'] }
        nominal: { type: [number, 'null'] }
        tolerance: { type: [number, 'null'] }
        specDisplay:
          type: string
          description: Verbatim printed specification text from the source document
          examples: ['150°C ± 5°C']
        stableKey: { type: string }
        displayOrder: { type: integer }

    JobSummary:
      type: object
      required: [id, jobNumber, assetCode, frequency, dueOn, status]
      properties:
        id: { type: string, format: uuid }
        jobNumber: { type: string, examples: [PM-2026-000431] }
        assetId: { type: string, format: uuid }
        assetCode: { type: string }
        assetDocumentId:
          type: string
          format: uuid
          description: |
            Slice 27-ASSETDOC. WHICH of the machine's documents this job
            records. A machine may carry several, so `assetId` alone no longer
            identifies the form the record belongs to.
        documentNumber: { type: string }
        revisionCode: { type: string }
        frequency: { $ref: '#/components/schemas/Frequency' }
        frequencyScope:
          type: array
          items: { $ref: '#/components/schemas/Frequency' }
        dueOn: { type: string, format: date }
        overdue: { type: boolean }
        status: { $ref: '#/components/schemas/JobStatus' }
        assignedTo: { type: [string, 'null'], format: uuid }
        assignedToName: { type: [string, 'null'] }
        isAdhoc:
          type: boolean
          description: |
            UR-028 - raised OFF-PLAN rather than generated from the
            maintenance schedule (slice 18-WORKFLOW). An ad-hoc job satisfies
            no schedule period and is EXCLUDED from UR-067 plan compliance;
            `/reports/overdue` and `/reports/pending` deliberately keep ad-hoc
            rows (an overdue breakdown is real outstanding work), so this flag
            is what stops those figures being ambiguous.

    Job:
      allOf:
        - $ref: '#/components/schemas/JobSummary'
        - type: object
          properties:
            draftVersion: { type: integer }
            titleMachineNumber:
              type: [string, 'null']
              minLength: 1
              maxLength: 50
              description: |
                Slice 31-TITLEBLANK - what the TECHNICIAN wrote into the blank
                in this record's title (`…Record ED____` + `01` ->
                `…Record ED01`), or null while it is still empty. Substituted
                at RENDER, never stored resolved. The PDF prefers this over
                the admin-set `AssetDocument.machineNumber`, which remains the
                fallback so records captured before this field existed print
                exactly as they did.
            titleHasFillableRun:
              type: boolean
              description: |
                Whether this record's title carries a fillable run of
                underscores, and so whether the technician is offered a box for
                it at all. DERIVED per response from the frozen revision's
                template title, never stored - the same shape and reasoning as
                `AssetDocument.titleHasFillableRun`. A form with the number
                pre-printed (EP01, PM01) or with no machine designation reports
                false, and no box is shown. There is deliberately no
                `resolvedTitle` counterpart on `Job`: a cached job's resolved
                title goes stale the moment the technician types a number
                offline.
            voidReason:
              type: [string, 'null']
              description: Slice 17 - the void ANNOTATION (never part of the signed record content). Populated only once the job is VOIDED.
            voidedBy: { type: [string, 'null'], format: uuid }
            voidedAt:
              type: [string, 'null']
              format: date-time
              description: Null for voids predating the slice-17 migration.
            templateRevision: { $ref: '#/components/schemas/TemplateRevision' }
            itemResults:
              type: array
              items: { $ref: '#/components/schemas/ItemResult' }
            measurementResults:
              type: array
              items: { $ref: '#/components/schemas/MeasurementResult' }
            partsUsed:
              type: array
              items: { $ref: '#/components/schemas/PartUsed' }
            attachments:
              type: array
              items: { $ref: '#/components/schemas/Attachment' }
            approvalSteps:
              type: array
              items: { $ref: '#/components/schemas/ApprovalStep' }

    ItemResultInput:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/ItemStatus' }
        remark: { type: [string, 'null'] }
        clientRecordedAt: { type: string, format: date-time }

    ItemResult:
      type: object
      required: [id, templateItemId, status]
      properties:
        id: { type: string, format: uuid }
        templateItemId: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/ItemStatus' }
        remark: { type: [string, 'null'] }
        recordedByName: { type: string }
        clientRecordedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    MeasurementResultInput:
      type: object
      properties:
        readingNumeric: { type: [number, 'null'] }
        readingText: { type: [string, 'null'] }
        remark: { type: [string, 'null'] }
        clientRecordedAt: { type: string, format: date-time }

    MeasurementResult:
      type: object
      required: [id, templateMeasurementId, judgement]
      properties:
        id: { type: string, format: uuid }
        templateMeasurementId: { type: string, format: uuid }
        readingNumeric: { type: [number, 'null'] }
        readingText: { type: [string, 'null'] }
        judgement: { $ref: '#/components/schemas/Judgement' }
        remark: { type: [string, 'null'] }
        recordedByName: { type: string }
        clientRecordedAt: { type: string, format: date-time }
        recordedAt: { type: string, format: date-time }

    TitleMachineNumberInput:
      type: object
      required: [titleMachineNumber]
      properties:
        titleMachineNumber:
          type: [string, 'null']
          minLength: 1
          maxLength: 50
          description: |
            Slice 31-TITLEBLANK. What the technician writes into the blank in
            the form's title. Bounds are deliberately identical to
            `AssetDocumentCreate.machineNumber`, the admin-set value this
            overrides - one blank, one set of rules, whoever fills it.
            Explicitly nullable: `null` CLEARS a mistyped value, while an
            empty string is rejected so nothing zero-width can reach a
            controlled title. Required in the body (the caller must say which
            of the two it means); the VALUE is not required until submit.

    PartUsedInput:
      type: object
      required: [description, quantity]
      properties:
        partNo: { type: [string, 'null'] }
        description: { type: string, minLength: 1 }
        quantity: { type: number, exclusiveMinimum: 0 }
        remarks: { type: [string, 'null'] }

    PartUpsertInput:
      type: object
      required: [description, quantity]
      properties:
        partNo: { type: [string, 'null'] }
        description: { type: string, minLength: 1 }
        quantity: { type: number, exclusiveMinimum: 0 }
        remarks: { type: [string, 'null'] }
        active: { type: boolean, default: true }

    PartUsed:
      type: object
      required: [id, description, quantity]
      properties:
        id: { type: string, format: uuid }
        partNo: { type: [string, 'null'] }
        description: { type: string }
        quantity: { type: number }
        remarks: { type: [string, 'null'] }

    Attachment:
      type: object
      required: [id, contentType, byteSize, uploadState]
      properties:
        id: { type: string, format: uuid }
        itemResultId: { type: [string, 'null'], format: uuid }
        originalFilename: { type: [string, 'null'] }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        byteSize: { type: integer }
        sha256: { type: string, description: Hex-encoded }
        uploadState: { type: string, enum: [pending, received] }
        uploadedByName: { type: string }
        uploadedAt: { type: string, format: date-time }

    ApprovalStep:
      type: object
      # NOTE (slice 7 code review, finding C): `actorName` is documented
      # OPTIONAL, matching what the implementation actually does.
      # `api/src/jobs/mappers.ts#toApprovalStep` never populates it —
      # `app_user.full_name` is application-layer encrypted (DBD §6.2) and no
      # read path anywhere in this codebase decrypts it yet. That's the SAME
      # already-established convention as ItemResult.recordedByName /
      # Attachment.uploadedByName / MeasurementResult.recordedByName /
      # TemplateRevision.authoredByName / TemplateRevision.approvedByName —
      # all optional/nullable, none populated, for the identical reason
      # (mappers.ts's header comment). `actorName` was previously left
      # `required` in this schema (a leftover from slice 1's speculative,
      # endpoint-not-yet-implemented scaffold) purely to dodge an oasdiff
      # "response property became optional" breaking-change flag — an
      # inaccurate contract kept to satisfy a gate is a defect, not a fix,
      # so it's corrected here. The oasdiff gate's baseline has been updated
      # (scripts/ci/oasdiff-ignore.yaml) to record this as an intentional,
      # reviewed correction rather than silencing/weakening the gate — see
      # slice-7-report.md, Fix C.
      required: [id, action, actedAt, stageOrdinal]
      properties:
        id: { type: string, format: uuid }
        stageOrdinal: { type: integer }
        stageLabel: { type: string, examples: ['Verified By (Workshop Team Leader)'] }
        action:
          type: string
          enum: [SUBMITTED, VERIFIED, RETURNED, RECALLED, VOIDED]
        actorId: { type: string, format: uuid }
        actorName: { type: string, description: 'Not currently populated — see schema-level note.' }
        actorRoleCode: { type: string }
        onBehalfOfName: { type: [string, 'null'], description: Set when acting under delegation }
        reason: { type: [string, 'null'] }
        actedAt: { type: string, format: date-time }
        signingKeyId: { type: string }

    AssignableUser:
      # Mirrors shared/src/job.ts `assignableUserSchema` exactly.
      type: object
      description: |
        Slice 32-PLANNERJOB — one candidate for `POST /jobs/{jobId}/assign`,
        as `GET /jobs/{jobId}/assignable-users` returns them.

        Deliberately narrower than `User`: enough to choose a person, and no
        personal data beyond the name. `roles` carries only the
        result-recording roles that put them on the list — the reason they are
        offered, not their full role set.
      required: [id, fullName, roles]
      properties:
        id: { type: string, format: uuid }
        fullName:
          type: string
          description: Decrypted at read time — `app_user.full_name` is application-layer encrypted (DBD §6.2).
        roles:
          type: array
          items: { type: string, examples: [MAINTAINER, TEAM_LEADER, ENGINEER] }

    AssignJobRequest:
      # Mirrors shared/src/job.ts `assignJobRequestSchema` exactly (contract
      # test pins keys + required-ness both directions).
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          type: string
          format: uuid
          description: The user this job is (re)assigned to.

    SubmitJobRequest:
      # Mirrors shared/src/job.ts `submitJobRequestSchema` exactly (contract
      # test pins keys + required-ness both directions).
      type: object
      required: [drawnSignature]
      properties:
        drawnSignature:
          type: string
          description: |
            The PERFORMER's signature (slice 18-WORKFLOW). Base64 PNG
            data-URL (`data:image/png;base64,...`, or bare base64) captured
            by the SAME on-system signature pad the verifier stages use -
            stylus, finger and mouse through one pointer-event path.
            MANDATORY: 422 (`/errors/validation-failed`) if absent, 422
            (`/errors/attachment-rejected`) if it is not a valid PNG
            (magic-byte check, S-30-style). Stored ENCRYPTED on
            `approval_step.drawn_signature_ct` (field-encryption, PR-106),
            never returned by any read path and never written to a log or an
            audit payload.
          examples: ['data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...']

    CreateAdhocJobRequest:
      # Mirrors shared/src/job.ts `createAdhocJobRequestSchema` exactly
      # (contract test pins keys + required-ness both directions).
      type: object
      required: [assetId, frequency, reason]
      properties:
        assetId:
          type: string
          format: uuid
          description: The machine the work is being raised against.
        assetDocumentId:
          type: string
          format: uuid
          description: |
            Slice 27-ASSETDOC. WHICH of the machine's documents this off-plan
            work is recorded on — the document decides which checklist is
            frozen onto the job. Optional only where the machine carries
            exactly one active document; where it carries several the server
            returns 422 rather than picking one.
        frequency:
          $ref: '#/components/schemas/Frequency'
          description: |
            Which depth of the frozen checklist is being performed. Labels
            the record; it does NOT make the job count against the plan (the
            job is created with an empty `frequencyScope`).
        reason:
          type: string
          minLength: 10
          description: |
            Why this work is being raised off-plan. MANDATORY and audited
            (UR-028), and enforced by the database too
            (`job_adhoc_reason_length_chk`), the same way void (INV-12) and
            return (INV-13) reasons are.
        dueOn:
          type: string
          format: date
          description: '`YYYY-MM-DD`. Defaults to today - the work is being raised now.'
        assigneeId:
          type: [string, 'null']
          format: uuid
          description: |
            Optional. When supplied the job is born ASSIGNED to this user,
            who must satisfy the same rules `POST /jobs/{jobId}/assign`
            applies (active, holds a result-recording role, can reach the
            job's area) - otherwise 422.

    VerifyJobRequest:
      type: object
      # NOTE (slice 7 code review, finding C): `drawnSignature` is REQUIRED
      # here, matching what the server actually enforces — the Zod schema
      # every request is validated against (shared/src/job.ts
      # verifyJobRequestSchema, ADR-002: same rule client and server share)
      # rejects an empty/absent value with 422. It was previously left OUT
      # of `required` purely to dodge an oasdiff "new required request
      # property" breaking-change flag against `origin/main`'s pre-slice-7
      # stub (whose body was documented as `{ comment }`, fully optional).
      # A mandatory electronic-signature field documented as optional is a
      # real client-facing defect (codegen would omit it), so it's corrected
      # here. The oasdiff gate's baseline has been updated
      # (scripts/ci/oasdiff-ignore.yaml) to record this as an intentional,
      # reviewed correction rather than silencing/weakening the gate — see
      # slice-7-report.md, Fix C.
      required: [drawnSignature]
      properties:
        drawnSignature:
          type: string
          description: |
            Base64 PNG data-URL (`data:image/png;base64,...`, or bare
            base64) captured by the on-system signature pad (the pad UI is
            slice 11; this field is the backend contract it POSTs to).
            422 (`/errors/attachment-rejected`) if empty/absent or not a
            valid PNG (magic-byte check). Magic-byte validated server-side
            (S-30-style); stored ENCRYPTED on `approval_step`
            (field-encryption, PR-106 approach).
          examples: ['data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAA...']
        onBehalfOf:
          type: [string, 'null']
          format: uuid
          description: |
            The delegator's user id, when acting under an active delegation
            (PR-076). Omit when acting on the caller's own authority.
        comment:
          type: [string, 'null']

    QueueEntry:
      allOf:
        - $ref: '#/components/schemas/JobSummary'
        - type: object
          required: [submittedAt, ageHours, escalated, stageOrdinal, stageCount, stageLabel]
          properties:
            submittedAt: { type: string, format: date-time }
            submittedByName: { type: string }
            ageHours: { type: number }
            escalated: { type: boolean }
            onBehalfOf:
              type: [string, 'null']
              format: uuid
              description: The delegator's user id (PR-076) when this entry is present because of an active delegation, not the caller's own eligibility.
            stageOrdinal:
              type: integer
              minimum: 1
              description: The approval stage this record is waiting at (the delivered route is two stages — Team Leader then Engineer).
              examples: [1]
            stageCount:
              type: integer
              minimum: 1
              description: How many stages the record's approval route has, so a client can render "stage 1 of 2" without a second lookup.
              examples: [2]
            stageLabel:
              type: string
              description: The administrator-configured `approval_stage.label` for that stage, verbatim (ADR-011 route-as-data).
              examples: ['Verified By (Workshop Team Leader)']

    Delegation:
      type: object
      required: [id, delegatorId, delegateId, validFrom, validTo, createdBy, createdAt]
      properties:
        id: { type: string, format: uuid }
        delegatorId: { type: string, format: uuid }
        delegatorName: { type: string }
        delegateId: { type: string, format: uuid }
        delegateName: { type: string }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        reason: { type: [string, 'null'] }
        createdBy: { type: string, format: uuid }
        revokedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    CreateDelegationRequest:
      type: object
      required: [delegatorId, delegateId, validFrom, validTo]
      properties:
        delegatorId: { type: string, format: uuid }
        delegateId: { type: string, format: uuid }
        validFrom: { type: string, format: date-time }
        validTo: { type: string, format: date-time }
        reason: { type: [string, 'null'] }

    RecordSummary:
      type: object
      required: [id, jobNumber, assetCode, archivedAt]
      properties:
        id: { type: string, format: uuid }
        jobNumber: { type: string }
        assetCode: { type: string }
        documentNumber: { type: string }
        revisionCode: { type: string }
        frequency: { $ref: '#/components/schemas/Frequency' }
        performedByName: { type: string }
        verifiedByName: { type: string }
        archivedAt: { type: string, format: date-time }

    SyncBootstrap:
      type: object
      required: [serverTime, user, jobs, syncToken]
      properties:
        serverTime:
          type: string
          format: date-time
          description: Returned so the client can compute and flag clock skew
        user: { $ref: '#/components/schemas/CurrentUser' }
        jobs:
          type: array
          items: { $ref: '#/components/schemas/Job' }
        deletedJobIds:
          type: array
          items: { type: string, format: uuid }
        syncToken: { type: string }

    OutboxMutation:
      type: object
      required: [id, sequence, method, path]
      properties:
        id: { type: string, format: uuid, description: Doubles as the idempotency key }
        sequence: { type: integer }
        clientRecordedAt: { type: string, format: date-time }
        method: { type: string, enum: [PUT, POST, DELETE] }
        path: { type: string }
        ifMatch: { type: [integer, 'null'] }
        body: { type: [object, 'null'], additionalProperties: true }

    OutboxResult:
      type: object
      required: [id, status, applied]
      properties:
        id: { type: string, format: uuid }
        status: { type: integer }
        applied: { type: boolean }
        problem: { $ref: '#/components/schemas/Problem' }

    IntegrityResult:
      type: object
      required: [recordId, intact, checkedAt]
      properties:
        recordId: { type: string, format: uuid }
        intact: { type: boolean }
        checkedAt: { type: string, format: date-time }
        voided:
          type: boolean
          description: Slice 17 - `intact` speaks ONLY to cryptographic integrity (a voided record's untouched content still verifies); `voided` states the record's standing. Both are reported; neither masks the other.
        voidReason: { type: [string, 'null'] }
        voidedAt: { type: [string, 'null'], format: date-time }
        signatures:
          type: array
          items:
            type: object
            properties:
              approvalStepId: { type: string, format: uuid }
              signerName: { type: string }
              actedAt: { type: string, format: date-time }
              signingKeyId: { type: string }
              hashMatches: { type: boolean }
              signatureValid: { type: boolean }
        mismatchDetail: { type: [string, 'null'] }

    AuditChainStatus:
      type: object
      required: [intact, checkedAt, eventCount, firstBreakSequence]
      properties:
        intact: { type: boolean }
        checkedAt: { type: string, format: date-time }
        eventCount: { type: integer }
        firstBreakSequence:
          type: [integer, 'null']
          description: Key is always present. `null` unless `intact` is false, in which case it's the first sequence number whose hash link failed to verify.
      # `firstBreakSequence` is now `required` (it's always present in the
      # real response), so the example must include it. It is deliberately
      # NOT given a literal `null` here — a literal-`null` example value on a
      # `type: [integer, 'null']` property crashes spectral-cli 6.16.2's
      # example-validation codegen (nimma) with "Cannot read properties of
      # null (reading 'enum')" (reproduced in isolation with a two-line
      # minimal schema). Instead this example depicts the OTHER valid shape —
      # a detected break (`intact: false` + a real sequence number) — which
      # is both a real, non-null value and arguably a more useful
      # illustrative example than the all-clear case anyway.
      example:
        {
          intact: false,
          checkedAt: '2026-07-24T02:00:00Z',
          eventCount: 418322,
          firstBreakSequence: 418299,
        }

    MeasurementTrend:
      type: object
      required: [assetCode, stableKey, points]
      properties:
        assetCode: { type: string }
        stableKey: { type: string }
        description: { type: string }
        unit: { type: [string, 'null'] }
        lowerLimit: { type: [number, 'null'] }
        upperLimit: { type: [number, 'null'] }
        points:
          type: array
          items:
            type: object
            properties:
              recordId: { type: string, format: uuid }
              performedOn: { type: string, format: date }
              revisionCode: { type: string }
              reading: { type: [number, 'null'] }
              judgement: { $ref: '#/components/schemas/Judgement' }

    RecordExportRequest:
      type: object
      description: At least one of `recordIds` or `filters` is required — an empty request is `422`.
      properties:
        recordIds:
          type: array
          maxItems: 500
          items: { type: string, format: uuid }
        filters:
          type: object
          description: Same shape as `GET /records`'s query parameters (minus `limit`/`cursor`).
          properties:
            assetId: { type: string, format: uuid }
            assetTypeId: { type: string, format: uuid }
            documentNumber: { type: string }
            frequency: { $ref: '#/components/schemas/Frequency' }
            archivedFrom: { type: string, format: date }
            archivedTo: { type: string, format: date }
            technician: { type: string, format: uuid }
            approver: { type: string, format: uuid }
            voided:
              type: boolean
              description: Slice 17 - same semantics as `GET /records`'s `voided` parameter (omitted = include voided-archived records).

    RecordExportStatus:
      type: object
      required: [id, status, recordCount, requestedAt, completedAt, downloadPath]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [PENDING, PROCESSING, DONE, FAILED] }
        recordCount: { type: integer }
        requestedAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }
        failedReason: { type: [string, 'null'] }
        downloadPath:
          type: [string, 'null']
          description: 'Only populated once status is DONE — the api-relative path to GET /exports/{exportId}/download (ADR-007, never a presigned URL).'

    ComplianceReportRow:
      type: object
      required:
        [areaId, areaCode, dueCount, completedOnTimeCount, completedLateCount, notCompletedCount, adhocExcludedCount, compliancePercent]
      properties:
        areaId: { type: [string, 'null'], format: uuid }
        areaCode: { type: [string, 'null'] }
        dueCount: { type: integer }
        completedOnTimeCount: { type: integer }
        completedLateCount: { type: integer }
        notCompletedCount: { type: integer }
        adhocExcludedCount:
          type: integer
          description: |
            Slice 18-WORKFLOW. Ad-hoc jobs (UR-028) due in the window that were
            EXCLUDED from every bucket above - UR-067 measures the maintenance
            PLAN, and off-plan work was never due under it. Reported so the
            exclusion is visible and the figure reconciles against a raw job
            count (AC-18).
        compliancePercent: { type: number }

    ComplianceReport:
      type: object
      required: [from, to, rows]
      properties:
        from: { type: string, format: date }
        to: { type: string, format: date }
        rows:
          type: array
          items: { $ref: '#/components/schemas/ComplianceReportRow' }

    PendingVerificationEntry:
      allOf:
        - $ref: '#/components/schemas/JobSummary'
        - type: object
          required: [submittedAt, ageHours]
          properties:
            submittedAt: { type: string, format: date-time }
            ageHours: { type: number }

# Security headers for every response — kept in ONE file precisely because of
# nginx's add_header inheritance rule: a location block that declares ANY
# add_header of its own DISCARDS every add_header inherited from the server
# block. That rule is why production served ZERO security headers on real
# pages for its entire life (crypto review 2026-07-27, CR-2): the server-level
# headers were silently dropped by every location that set Cache-Control.
#
# Therefore: this file must be `include`d in the server block AND in EVERY
# location that uses add_header. scripts/ci/assert-csp-safe.sh enforces that
# mechanically — do not add an add_header to a location without the include.
#
# HSTS is deliberately NOT set here: this container terminates plain HTTP
# behind the host TLS proxy, and HSTS belongs at the TLS terminator (the
# form.bevorasg.com vhost on the host sets it).
add_header X-Content-Type-Options   "nosniff"                        always;
add_header X-Frame-Options          "DENY"                           always;
add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
add_header Permissions-Policy       "camera=(self), geolocation=(), microphone=(), payment=()" always;
add_header Cross-Origin-Opener-Policy "same-origin"                  always;
add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

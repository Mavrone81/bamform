# Static PWA. Security headers are ALSO set here, not only at the edge proxy —
# defence in depth, and correct if the edge config is ever changed by another team.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options   "nosniff"                        always;
    add_header X-Frame-Options          "DENY"                           always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "camera=(self), geolocation=(), microphone=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                  always;
    add_header Content-Security-Policy  "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; object-src 'none'" always;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Hashed assets — immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker must never be cached, or a deploy cannot reach clients (PR-068)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}

# Static PWA. Security headers are ALSO set here, not only at the edge proxy —
# defence in depth, and correct if the edge config is ever changed by another team.
#
# ⚠ add_header INHERITANCE (crypto review 2026-07-27, CR-2): a location block
# with ANY add_header of its own discards every add_header inherited from the
# server block. The original config set the six security headers at server
# level and then added Cache-Control in each location — so every real page
# shipped with NO security headers, while the CI grep (which only checked the
# headers were present in this file) stayed green. The headers now live in
# security-headers.conf, included in the server block AND re-included in every
# location that uses add_header; assert-csp-safe.sh enforces that pairing.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # Hashed assets — immutable
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Service worker must never be cached, or a deploy cannot reach clients (PR-068)
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
